<script>
'use strict';
// ============================================================
//  ELDERHAVEN: THE SACRED CREST  —  engine
//  Input, audio (pulse/triangle/noise chiptune), font, storage
// ============================================================
const W = 256, H = 240, TS = 16, COLS = 16, ROWS = 11, HUD = 64;
const screen = document.getElementById('screen');
const ctx = screen.getContext('2d');
ctx.imageSmoothingEnabled = false;

// NES-style master palette (single-character keys used by all pixel art)
const C = {
  k:'#000000', w:'#FCFCFC', g:'#BCBCBC', G:'#7C7C7C', r:'#D82800', R:'#881400',
  o:'#FC9838', s:'#FCBC88', b:'#C84C0C', B:'#503000', y:'#F8B800', Y:'#FCE0A8',
  e:'#00A800', E:'#005800', l:'#B8F818', u:'#0058F8', U:'#0000BC', c:'#3CBCFC',
  p:'#F878F8', P:'#6844FC', t:'#FCD8A8', n:'#AC7C00', q:'#00A844', a:'#A4E4FC'
};

// ---------------- INPUT ----------------
const BTN = ['up','down','left','right','a','b','start','select'];
const DIRS = ['up','down','left','right'];
const DV = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
const OPP = { up:'down', down:'up', left:'right', right:'left' };
const KEYMAP = {
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left',
  ArrowRight:'right', KeyD:'right', KeyX:'a', KeyK:'a', Space:'a', KeyZ:'b', KeyJ:'b',
  Enter:'start', Escape:'start', ShiftLeft:'select', ShiftRight:'select', KeyC:'select'
};
const Input = {
  keys:{}, touch:{}, latch:{}, down:{}, prev:{}, pressed:{}, order:[], textMode:false, typed:[],
  update() {
    for (const b of BTN) {
      const d = !!(this.keys[b] || this.touch[b] || this.latch[b]); this.latch[b] = false;
      this.pressed[b] = d && !this.prev[b];
      this.down[b] = d; this.prev[b] = d;
    }
    for (const d of DIRS) if (this.pressed[d]) { this.order = this.order.filter(x => x !== d); this.order.push(d); }
    this.order = this.order.filter(d => this.down[d]);
  },
  dir() { return this.order.length ? this.order[this.order.length - 1] : null; },
  clear() { for (const b of BTN) { this.pressed[b] = false; } this.typed.length = 0; }
};
window.addEventListener('keydown', e => {
  Snd.init();
  if (e.code === 'KeyM' && !Input.textMode && window.cycleSound) { cycleSound(); e.preventDefault(); return; }
  if (Input.textMode) {
    if (/^Key[A-Z]$/.test(e.code) || /^Digit[0-9]$/.test(e.code)) { Input.typed.push(e.code.slice(-1)); e.preventDefault(); return; }
    if (e.code === 'Backspace') { Input.typed.push('DEL'); e.preventDefault(); return; }
    if (e.code === 'Minus') { Input.typed.push('-'); return; }
    if (e.code === 'Space') { Input.typed.push(' '); e.preventDefault(); return; }
    if (e.code.startsWith('Key') && !e.code.startsWith('Arrow')) return;
  }
  const b = KEYMAP[e.code];
  if (b) { if (!e.repeat) Input.latch[b] = true; Input.keys[b] = true; e.preventDefault(); }
});
window.addEventListener('keyup', e => { const b = KEYMAP[e.code]; if (b) { Input.keys[b] = false; e.preventDefault(); } });
window.addEventListener('blur', () => { Input.keys = {}; Input.touch = {}; });

// ---------------- AUDIO ----------------
function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
const NOTE_IDX = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
function parseNotes(str) {
  const out = [];
  for (const tok of str.trim().split(/[\s|]+/)) {
    if (!tok) continue;
    const [n, d] = tok.split(':'); const dur = +d || 4;
    if (n === 'R') { out.push([null, dur]); continue; }
    if (n === 'H') { out.push([1.0, dur]); continue; }   // noise hat
    if (n === 'S') { out.push([0.35, dur]); continue; }  // noise snare
    if (n === 'K') { out.push([0.12, dur]); continue; }  // noise kick
    const m = n.match(/^([A-G])([#b]?)(\d)$/);
    if (!m) continue;
    let v = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    out.push([12 * (+m[3] + 1) + v, dur]);
  }
  return out;
}
function bassFrom(roots, oct) {
  return roots.map(r => { const lo = r + oct, hi = r + (oct + 1); return `${lo}:2 ${hi}:2 ${lo}:2 ${hi}:2 ${lo}:2 ${hi}:2 ${lo}:2 ${hi}:2`; }).join(' ');
}
const DRUMBAR = 'K:4 H:2 H:2 S:4 H:2 H:2';

const SONGS = {
  title: { bpm: 96, tracks: [
    { w:0.25, v:0.22, n:'G4:4 B4:4 D5:4 B4:4 C5:4 E5:4 D5:8 B4:4 C5:4 D5:4 G4:4 A4:12 R:4 G4:4 B4:4 D5:4 G5:4 E5:4 C5:4 D5:8 C5:4 B4:4 A4:4 F#4:4 G4:12 R:4' },
    { w:0.125, v:0.13, n:'D4:8 G4:8 E4:8 B4:8 G4:8 B4:8 F#4:12 R:4 D4:8 B4:8 C5:8 B4:8 A4:8 D4:8 D4:12 R:4' },
    { w:'tri', v:0.32, n:'G2:4 D3:4 G2:4 D3:4 C3:4 G2:4 G2:4 D3:4 G2:4 D3:4 G2:4 B2:4 D3:4 A2:4 D3:4 F#2:4 G2:4 D3:4 G2:4 D3:4 C3:4 E3:4 G2:4 D3:4 D3:4 C3:4 A2:4 F#2:4 G2:4 D3:4 G2:8' } ] },
  chapel: { bpm: 66, tracks: [
    { w:0.5, v:0.12, n:'G4:4 B4:4 D5:4 B4:4 C5:4 E5:4 D5:8 B4:4 C5:4 D5:4 G4:4 A4:12 R:4 G4:4 B4:4 D5:4 G5:4 E5:4 C5:4 D5:8 C5:4 B4:4 A4:4 F#4:4 G4:12 R:4' },
    { w:'tri', v:0.3, n:'G3:16 C3:8 G3:8 G3:16 D3:16 G3:16 C3:8 G3:8 D3:16 G3:16' } ] },
  overworld: { bpm: 148, tracks: [
    { w:0.25, v:0.2, n:
      'D5:4 A4:2 D5:2 E5:2 F5:2 G5:4 F5:2 E5:2 D5:4 A4:8 Bb4:4 C5:2 D5:2 C5:4 A4:4 G4:2 A4:2 Bb4:2 C5:2 A4:8 ' +
      'D5:4 A4:2 D5:2 E5:2 F5:2 G5:4 A5:4 G5:2 F5:2 E5:4 C5:4 D5:2 E5:2 F5:2 E5:2 D5:4 C#5:4 D5:12 R:4 ' +
      'F5:4 F5:2 G5:2 A5:4 F5:4 G5:4 F5:2 E5:2 D5:8 E5:4 E5:2 F5:2 G5:4 E5:4 F5:4 E5:2 D5:2 C#5:8 ' +
      'D5:2 F5:2 A5:4 G5:2 F5:2 E5:4 F5:2 E5:2 D5:2 C5:2 Bb4:4 A4:4 Bb4:2 A4:2 G4:2 E4:2 A4:4 C#5:4 D5:12 R:4' },
    { w:'tri', v:0.3, n: bassFrom(['D','D','Bb','F','D','F','A','D','F','Bb','C','A','D','Bb','A','D'], 2) },
    { w:'noise', v:0.05, n: Array(16).fill(DRUMBAR).join(' ') } ] },
  dungeon: { bpm: 118, tracks: [
    { w:0.125, v:0.16, n:
      'A4:2 C5:2 E5:2 C5:2 A4:2 C5:2 E5:2 C5:2 G#4:2 B4:2 E5:2 B4:2 G#4:2 B4:2 E5:2 B4:2 ' +
      'G4:2 Bb4:2 E5:2 Bb4:2 G4:2 Bb4:2 E5:2 Bb4:2 F4:2 A4:2 D5:2 A4:2 E4:2 G#4:2 B4:2 D5:2 ' +
      'A4:2 E5:2 A5:2 E5:2 C5:2 E5:2 A5:2 E5:2 B4:2 E5:2 G#5:2 E5:2 B4:2 E5:2 G#5:2 E5:2 ' +
      'C5:2 E5:2 G5:2 E5:2 Bb4:2 E5:2 G5:2 E5:2 A4:2 D5:2 F5:2 D5:2 G#4:2 B4:2 E5:4' },
    { w:'tri', v:0.32, n:'A2:16 G#2:16 G2:16 F2:8 E2:8 A2:16 G#2:16 G2:16 F2:8 E2:8' } ] },
  boss: { bpm: 168, tracks: [
    { w:0.25, v:0.18, n:'E4:2 E4:2 F4:2 E4:2 E4:2 Bb4:2 A4:2 F4:2 E4:2 E4:2 F4:2 E4:2 G4:2 F4:2 E4:2 D#4:2' },
    { w:'tri', v:0.32, n:'E2:2 E3:2 E2:2 E3:2 E2:2 E3:2 E2:2 E3:2 E2:2 E3:2 E2:2 E3:2 F2:2 F3:2 D#2:2 D#3:2' },
    { w:'noise', v:0.05, n:'K:2 H:2 S:2 H:2 K:2 H:2 S:2 H:2 K:2 H:2 S:2 H:2 K:2 K:2 S:2 S:2' } ] },
  gameover: { bpm: 80, loop:false, tracks: [
    { w:0.25, v:0.2, n:'A4:4 G4:4 F4:4 E4:4 D4:8 E4:4 C#4:4 D4:16' },
    { w:'tri', v:0.3, n:'D3:8 A2:8 Bb2:8 A2:8 D2:16' } ] },
  victory: { bpm: 110, loop:false, tracks: [
    { w:0.25, v:0.22, n:'G4:2 B4:2 D5:2 G5:6 R:2 F#5:2 G5:2 A5:2 B5:12' },
    { w:0.125, v:0.12, n:'D4:2 G4:2 B4:2 D5:6 R:2 D5:2 D5:2 F#5:2 G5:12' },
    { w:'tri', v:0.3, n:'G2:8 D3:8 G2:16' } ] }
};

SONGS.dungeon2 = Object.assign({}, SONGS.dungeon, { bpm: 104, tr: -2 });
SONGS.dungeon3 = Object.assign({}, SONGS.dungeon, { bpm: 90, tr: -5 });
SONGS.dungeon4 = Object.assign({}, SONGS.dungeon, { bpm: 128, tr: 3 });
SONGS.dungeon5 = Object.assign({}, SONGS.dungeon, { bpm: 110, tr: 5 });
SONGS.dungeon6 = Object.assign({}, SONGS.dungeon, { bpm: 100, tr: -7 });
SONGS.dungeon7 = Object.assign({}, SONGS.dungeon, { bpm: 92, tr: 2 });
SONGS.dungeon8 = Object.assign({}, SONGS.dungeon, { bpm: 136, tr: -4 });
SONGS.dungeon9 = Object.assign({}, SONGS.dungeon, { bpm: 146, tr: -1 });
const Snd = {
  ac:null, master:null, mus:null, fx:null, pulse:{}, noiseBuf:null,
  cur:null, want:null, tracks:[], timer:null, step:0.1, loop:true,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { this.ac = new AC(); } catch (e) { return; }
    this.master = this.ac.createGain(); this.master.gain.value = this.mode === 2 ? 0 : 0.6;
    this.master.connect(this.ac.destination);
    this.mus = this.ac.createGain(); this.mus.gain.value = this.mode === 1 ? 0 : 0.55; this.mus.connect(this.master);
    this.fx = this.ac.createGain(); this.fx.gain.value = 0.8; this.fx.connect(this.master);
    for (const d of [0.125, 0.25, 0.5]) {
      const n = 32, re = new Float32Array(n), im = new Float32Array(n);
      for (let i = 1; i < n; i++) re[i] = 2 * Math.sin(Math.PI * i * d) / (Math.PI * i);
      this.pulse[d] = this.ac.createPeriodicWave(re, im);
    }
    const len = this.ac.sampleRate, buf = this.ac.createBuffer(1, len, this.ac.sampleRate), data = buf.getChannelData(0);
    let v = 0; for (let i = 0; i < len; i++) { if (i % 6 === 0) v = Math.random() * 2 - 1; data[i] = v; }
    this.noiseBuf = buf;
    if (this.want) { const w = this.want; this.want = null; this.play(w); }
  },
  mode: (() => { try { return +localStorage.getItem('elderhaven_sound') || 0; } catch (e) { return 0; } })(),
  get muted() { return this.mode === 2; },
  setMode(m) {
    this.mode = m; try { localStorage.setItem('elderhaven_sound', String(m)); } catch (e) {}
    if (this.master) this.master.gain.value = m === 2 ? 0 : 0.6;
    if (this.mus) this.mus.gain.value = m === 1 ? 0 : 0.55;
  },
  label() { return ['SOUND ON', 'MUSIC OFF', 'SOUND OFF'][this.mode]; },
  osc(wave, freq, t, dur, vol, dest, slide) {
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    if (wave === 'tri') o.type = 'triangle'; else o.setPeriodicWave(this.pulse[wave] || this.pulse[0.5]);
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, t + dur * 0.75); g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.fx); o.start(t); o.stop(t + dur + 0.03);
  },
  noise(t, dur, vol, dest, rate) {
    const s = this.ac.createBufferSource(), g = this.ac.createGain();
    s.buffer = this.noiseBuf; s.playbackRate.value = rate || 1;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(g); g.connect(dest || this.fx); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  seq(notes, wave, step, vol, t0) { // notes = midi numbers
    const t = (t0 || this.ac.currentTime);
    notes.forEach((m, i) => { if (m) this.osc(wave, mtof(m), t + i * step, step * 0.95, vol); });
  },
  sfx(name) {
    if (!this.ac) return;
    const t = this.ac.currentTime;
    switch (name) {
      case 'sword': this.noise(t, 0.1, 0.35, null, 0.9); this.osc(0.5, 700, t, 0.08, 0.12, null, 200); break;
      case 'beam': this.seq([96, 91, 96, 91, 88], 0.25, 0.03, 0.12); break;
      case 'hit': this.osc(0.5, 300, t, 0.12, 0.25, null, 60); this.noise(t, 0.08, 0.3, null, 0.6); break;
      case 'kill': this.noise(t, 0.3, 0.45, null, 0.35); this.osc(0.25, 400, t, 0.2, 0.15, null, 50); break;
      case 'hurt': this.osc(0.25, 500, t, 0.08, 0.25, null, 200); this.osc(0.25, 300, t + 0.08, 0.12, 0.25, null, 80); break;
      case 'shield': this.osc(0.125, 1500, t, 0.05, 0.15); this.osc(0.125, 1000, t + 0.05, 0.05, 0.12); break;
      case 'gem': this.seq([88, 95, 100], 0.25, 0.05, 0.16); break;
      case 'gem5': this.seq([88, 95, 100, 95, 100, 107], 0.25, 0.04, 0.15); break;
      case 'heart': this.seq([81, 86, 93], 0.5, 0.05, 0.14); break;
      case 'item': this.seq([67, 72, 76, 79, 79, 0, 76, 79], 0.25, 0.09, 0.18); this.seq([43, 0, 48, 0, 52, 0, 55, 55], 'tri', 0.09, 0.3); break;
      case 'shard': this.seq([67, 71, 74, 79, 0, 78, 79, 81, 83, 83, 83, 83], 0.25, 0.1, 0.2); this.seq([55, 59, 62, 67, 0, 62, 67, 69, 71, 71], 0.125, 0.1, 0.1); break;
      case 'secret': this.seq([79, 78, 74, 69, 68, 76, 80, 84], 0.25, 0.085, 0.16); break;
      case 'bomb_drop': this.osc(0.5, 220, t, 0.05, 0.15); break;
      case 'bomb': this.noise(t, 0.6, 0.6, null, 0.18); this.noise(t, 0.25, 0.5, null, 0.5); break;
      case 'arrow': this.noise(t, 0.15, 0.25, null, 1.4); break;
      case 'boomerang': this.osc(0.125, 1100, t, 0.05, 0.08); this.osc(0.125, 900, t + 0.06, 0.05, 0.08); break;
      case 'fire': this.noise(t, 0.4, 0.3, null, 0.25); break;
      case 'magic': this.osc(0.25, 1800, t, 0.25, 0.12, null, 400); break;
      case 'unlock': this.seq([60, 72], 0.5, 0.06, 0.2); this.noise(t + 0.12, 0.1, 0.3, null, 0.5); break;
      case 'door': this.noise(t, 0.2, 0.3, null, 0.3); this.osc(0.5, 120, t, 0.15, 0.15, null, 60); break;

// ---------------- DUNGEON TILE SET (built per palette) ----------------
function buildDungeonTiles(p) {
  const d = {};
  d.floor = tileCanvas(g => { px(g, p.floor, 0, 0, 16, 16); px(g, p.floorLo, 0, 0, 16, 1); px(g, p.floorLo, 0, 0, 1, 16); px(g, p.floorHi, 4, 4, 8, 8); px(g, p.floor, 5, 5, 6, 6); });
  d.O = tileCanvas(g => { px(g, p.wallLo, 0, 0, 16, 16); px(g, p.wallHi, 0, 0, 16, 3); px(g, p.wallHi, 0, 0, 3, 16); px(g, p.wall, 3, 3, 10, 10); px(g, 'k', 0, 15, 16, 1); px(g, 'k', 15, 0, 1, 16); });
  d.Q = d.O;
  d.S = tileCanvas(g => { px(g, p.floor, 0, 0, 16, 16); px(g, p.wallLo, 3, 2, 10, 14); px(g, p.wallHi, 4, 1, 8, 4); px(g, 'k', 5, 2, 2, 2); px(g, 'k', 9, 2, 2, 2); px(g, p.wall, 4, 6, 8, 8); px(g, p.wallHi, 2, 13, 12, 3); });
  d.W = [0, 1].map(f => tileCanvas(g => { px(g, '#0000BC', 0, 0, 16, 16); px(g, '#3CBCFC', (2 + f * 5) % 12, 4, 4, 1); px(g, '#3CBCFC', (8 + f * 5) % 12, 11, 4, 1); }));
  d.Z = T['Z'];
  d.k = tileCanvas(g => px(g, 'k', 0, 0, 16, 16));
  return d;
}

}
function updatePlay() {
  G.t++;

  if (G.scroll) { G.scroll.t++; if (G.scroll.t >= G.scroll.dur) endScroll(); return; }
  if (Input.pressed.start && !G.holdItem) { G.state = 'inv'; Snd.sfx('pause'); G.invMsg = null; return; }
  if (G.msg && --G.msg.t <= 0) G.msg = null;
  if (G.savedT > 0) G.savedT--;
  if (G.gateMsgT > 0) G.gateMsgT--; if (G.denyT > 0) G.denyT--;
  if (G.holdItem) {
    if (--G.holdT <= 0) {
      const id = G.holdItem; G.holdItem = null;
      if (id === 'shard') { const e = G.dun.exitTo; Snd.sfx('stairs'); fadeTo(() => { loadOW(e.sx, e.sy); G.player.x = e.x; G.player.y = e.y + 8; G.player.dir = 'down'; owEnter(); saveGame(); }); }
    }
    return;
  }
  if (G.fairyT) { if (G.t % 5 === 0) { G.prof.hp = Math.min(G.prof.maxHp, G.prof.hp + 1); Snd.sfx('heart'); } if (G.prof.hp >= G.prof.maxHp) G.fairyT = 0; return; }
  if (G.harpT) { if (--G.harpT === 0) harpEffect(); return; }
  if (G.caveText && !caveTextDone()) { G.textT++; if (G.textT % 3 === 0) Snd.sfx('text'); return; }
  if (G.pendingItems) { G.pickups.push(...G.pendingItems); G.pendingItems = null; }
  const pl = G.player;

    const a = G.autoWalk;
    if (a.n > 0) { const [dx, dy] = DV[a.dir]; pl.x += dx; pl.y += dy; pl.dir = a.dir; pl.anim++; a.n--; }
    if (a.n <= 0) { G.autoWalk = null; G.dirty = true; if (!G.roomClear && Object.values(G.rm.doors).includes('shutter')) Snd.sfx('door'); }
  } else if (G.raft) {

    const tx = Math.floor((pl.x + 8) / 16), ty = Math.floor((pl.y + 8) / 16), ch = G.tiles[ty] && G.tiles[ty][tx];

  for (const q of G.pprojs) if (!q.dead) q.update();

  G.ents = G.ents.filter(e => !e.dead); G.pprojs = G.pprojs.filter(q => !q.dead);

}

  if (G.area === 'dun') tr.push([p.dmap[G.dnum], S.map], [p.dcomp[G.dnum], S.compass]);
  let x = 28; for (const [own, img] of tr) { if (own) { ctx.drawImage(img, x, 115); x += 24; } }
  text('SHARDS OF WISDOM', 24, 148, C.y);
  for (let i = 0; i < 8; i++) { const img = p.shards.includes(i + 1) ? S.shard : tint(S.shard, '#303030'); ctx.drawImage(img, 28 + i * 26, 160); }
  textC(`${p.name}   HEARTS ${p.maxHp / 2}   FALLS ${p.deaths}`, 186, C.G);
  textC('SELECT MENU   START RESUME', 204, C.w);
  if (G.invMsg) textC(G.invMsg, 222, C.l);
  if (G.invMenu != null) {
    ctx.fillStyle = '#000'; ctx.fillRect(56, 120, 144, 64); frame8(56, 120, 144, 64, C.w);
    ['SAVE', 'SAVE AND QUIT', 'BACK'].forEach((t, i) => text(t, 84, 132 + i * 16, C.w));
    ctx.drawImage(S.heart, 68, 132 + G.invMenu * 16);
  }
}

// ---------------- MAIN LOOP ----------------
// ---------------- THE ENDING ----------------
function startEnding() {
  const p = G.prof; p.won = 1; setFlag('won'); setFlag('boss:9'); saveGame();
  G.state = 'ending'; G.endT = 0; G.endY = 236; G.msg = null; Snd.stop(); Snd.play('victory');
  G.endLines = ['THE DARK LORD MORGRATH', 'IS DEFEATED.', '', 'THE SACRED CREST IS WHOLE', 'ONCE MORE, AND PEACE HAS', 'RETURNED TO ELDERHAVEN.', '',
    'PRINCESS SERAPHINA SAID:', `"THANK YOU, ${p.name}.`, 'YOU WERE BRAVE, AND YOU', 'WERE KIND. COURAGE IS', 'GOOD, BUT MERCY IS', 'GREATER STILL."', '',
    '"BE STRONG AND OF A GOOD', 'COURAGE... FOR THE LORD', 'THY GOD IS WITH THEE', 'WHITHERSOEVER THOU', 'GOEST."', '       JOSHUA 1:9', '', '',
    'THE END', '', 'THANK YOU FOR PLAYING!'];
  G.endStop = 196 - (G.endLines.length - 1) * 12;
}
function updateEnding() {
  G.t++; G.endT++;
  if (G.endT === 170) Snd.play('title');
  if (G.endT > 140 && G.endY > G.endStop) G.endY -= 0.33;
  if (G.endY <= G.endStop && (Input.pressed.start || Input.pressed.a)) { Snd.stop(); G.state = 'title'; G.t = 0; G.profiles = Store.load(); }
}
function drawEnding() {
  drawStars();
  ctx.drawImage(S.crestPower, 120, 4);
  ctx.drawImage((G.prof.items.mantle ? S.heroMantle : S.hero).down[(G.t >> 4) & 1], 88, 24, 32, 32);
  ctx.drawImage(S.princess, 136, 24, 32, 32);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 64, 256, 156); ctx.clip();
  G.endLines.forEach((ln, i) => { const y = Math.round(G.endY + i * 12); if (y > 56 && y < 224) textC(ln, y, ln === 'THE END' ? C.y : C.w); });
  ctx.restore();
  if (G.endY <= G.endStop && blink(5)) textC('PUSH START', 226, C.G);
}

const UPDATE = { ending: updateEnding, title: updateTitle, story: updateStory, select: updateSelect, register: updateRegister, erase: updateErase,
  play: updatePlay, inv: updateInv, dying: updateDying, gameover: updateGameOver };
const DRAW = { ending: drawEnding, title: drawTitle, story: drawStory, select: drawSelect, register: drawRegister, erase: drawErase,
  play: drawPlay, inv: drawInv, dying: drawDying, gameover: drawGameOver };
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) {
    Input.update();
    try { UPDATE[G.state](); } catch (e) { console.error(e); }
    acc -= 1000 / 60;
  }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  try { DRAW[G.state](); } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}

// ---------------- SCREEN FIT & TOUCH ----------------
let isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
function fit() {
  // measure the space inside the page's own padding (the hosted page keeps a side gutter)
  const cs = getComputedStyle(document.body), bw = document.body.clientWidth, bh = document.body.clientHeight;
  const vw = (bw || window.innerWidth) - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
  const vh = (bh || window.innerHeight) - parseFloat(cs.paddingTop || 0) - parseFloat(cs.paddingBottom || 0);
  const portrait = window.innerHeight > window.innerWidth;
  document.body.classList.toggle('touch', isTouch); document.body.classList.toggle('portrait', portrait);
  const availH = isTouch && portrait ? vh * 0.6 : vh;
  // in landscape, keep the D-pad and A/B buttons beside the picture instead of on top of it
  const availW = isTouch && !portrait ? Math.max(vw * 0.5, vw - 2 * 186) : vw;
  let s = Math.min(availW / W, availH / H); if (!isTouch && s >= 2) s = Math.floor(s);
  screen.style.width = Math.floor(W * s) + 'px'; screen.style.height = Math.floor(H * s) + 'px';
}
function setupTouch() {
  const pad = document.getElementById('dpad');
  let padId = null;
  const setDir = (e) => {
    const r = pad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    for (const d of DIRS) Input.touch[d] = false;
    if (Math.hypot(dx, dy) < r.width * 0.12) return;
    const nd = dirToward(dx, dy); if (!Input.touch[nd]) Input.latch[nd] = true; Input.touch[nd] = true;
  };
  pad.addEventListener('pointerdown', e => { Snd.init(); padId = e.pointerId; pad.setPointerCapture(e.pointerId); setDir(e); e.preventDefault(); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === padId) setDir(e); });
  const padUp = e => { if (e.pointerId === padId) { padId = null; for (const d of DIRS) Input.touch[d] = false; } };
  pad.addEventListener('pointerup', padUp); pad.addEventListener('pointercancel', padUp);
  document.querySelectorAll('[data-btn]').forEach(el => {
    const b = el.dataset.btn;
    el.addEventListener('pointerdown', e => { Snd.init(); el.setPointerCapture(e.pointerId); Input.touch[b] = true; Input.latch[b] = true; el.classList.add('on'); e.preventDefault(); });
    const up = () => { Input.touch[b] = false; el.classList.remove('on'); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  });
  document.getElementById('fs').addEventListener('click', () => {
    const d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => {}); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  });
  const labels = () => document.querySelectorAll('.soundBtn').forEach(b => b.textContent = Snd.label());
  window.cycleSound = () => { Snd.init(); Snd.setMode((Snd.mode + 1) % 3); labels(); };
  document.querySelectorAll('.soundBtn').forEach(b => b.addEventListener('click', cycleSound));
  labels();
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('pointerdown', () => Snd.init());
  // pause (and save) whenever the game is hidden: app switch, lock screen, tab change
  const autoPause = (save) => {
    if (G.state === 'play' && !G.scroll && !G.fade) { G.state = 'inv'; G.invMenu = null; G.invMsg = 'PAUSED'; }
    if (save && G.prof && ['play', 'inv'].includes(G.state)) saveGame();
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(true); if (!Snd.ac) return; if (document.hidden) Snd.ac.suspend(); else Snd.ac.resume(); });
  window.addEventListener('blur', () => autoPause(false));
  window.addEventListener('pagehide', () => autoPause(true));
}

// ---------------- TAP TO CHOOSE (menus work by touching the picture) ----------------
function setupTapMenus() {
  screen.addEventListener('pointerdown', e => {
    Snd.init();
    const r = screen.getBoundingClientRect(), gx = (e.clientX - r.left) / r.width * W, gy = (e.clientY - r.top) / r.height * H;
    const A = () => { Input.latch.a = true; }, inRow = (y) => gy >= y - 6 && gy < y + 14;
    switch (G.state) {
      case 'title': case 'story': Input.latch.start = true; break;
      case 'select':
        for (let i = 0; i < 3; i++) if (gy >= 44 + i * 34 && gy < 76 + i * 34) { G.cur = i; A(); return; }
        if (inRow(160)) { G.cur = 3; A(); } else if (inRow(176)) { G.cur = 4; A(); }
        break;
      case 'erase':
        if (G.confirm) { if (gy > 180) Input.latch[gx < 128 ? 'a' : 'b'] = true; return; }
        for (let i = 0; i < 3; i++) if (gy >= 44 + i * 34 && gy < 76 + i * 34) { G.cur = i; A(); return; }
        if (inRow(160)) { G.cur = 3; A(); }
        break;
      case 'register': {
        const row = Math.floor((gy - 76) / 16), col = Math.floor((gx - 36) / 16);
        if (row >= 0 && row < NAME_GRID.length && col >= 0 && col < 11) { G.gy = row; G.gx = col; A(); }
        else if (row === NAME_GRID.length) { const b = gx < 80 ? 0 : gx < 150 ? 1 : 2; G.gy = row; G.gx = b; A(); }
        break;
      }
      case 'gameover':
        for (let i = 0; i < 3; i++) if (inRow(104 + i * 24)) { G.cur = i; A(); }
        break;
      case 'inv': {
        if (G.invMenu != null) { for (let i = 0; i < 3; i++) if (inRow(132 + i * 16) && gx > 56 && gx < 200) { G.invMenu = i; A(); } return; }
        const own = ownedItems();
        INV_ORDER.forEach((id, i) => { const x = 128 + i * 18; if (gx >= x - 2 && gx < x + 18 && gy >= 34 && gy < 62 && own.includes(id)) { G.prof.bsel = id; Snd.sfx('select'); } });
        break;
      }
    }
  });
}

// ---------------- FAMILY ARCADE ----------------
// Inside the arcade, hide our own Fullscreen button and keep our buttons out of the corner
// where the arcade's ⌂ return button sits (the family can drag it to any corner).
function setupArcade() {
  try {
    if (!(window.FamilyArcade || window.__FA_RUNTIME__)) return;
    document.body.classList.add('fa');
    let corner = 'tl';
    const apply = () => { for (const c of ['tl', 'tr', 'bl', 'br']) document.body.classList.toggle('fa-' + c, c === corner); };
    apply();
    const pd = window.parent !== window && window.parent.document, btn = pd && pd.querySelector('.home-btn');
    if (btn) {
      const sync = () => { corner = btn.dataset.corner || 'tl'; apply(); };
      sync(); new MutationObserver(sync).observe(btn, { attributes: true, attributeFilter: ['data-corner'] });
    }
  } catch (e) { /* the arcade's page is not reachable: keep the default corner */ }
}

buildArt();
setupTapMenus();
setupArcade();
window.addEventListener('resize', fit);
fit(); setupTouch();
// When the hosted page is updated, save first and drop back into the same profile afterwards.
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => { if (G.prof && ['play', 'inv'].includes(G.state)) saveGame(); return { slot: G.prof ? G.slot : null }; });
function boot(data) {
  data = data || {};
  if (data.slot != null && G.profiles[data.slot]) startGame(data.slot);
  requestAnimationFrame(loop);
}
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data);
</script>
