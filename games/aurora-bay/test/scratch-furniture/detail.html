<!doctype html><html><head><meta charset=utf-8><title>detail</title></head>
<body style="margin:0;background:#cfe0f5">
<canvas id=c width=1350 height=1000></canvas>
<script src="../../js/core.js"></script><script src="../../js/art.js"></script><script src="../../js/characters.js"></script><script src="../../js/furniture.js"></script>
<script>
var ctx = document.getElementById('c').getContext('2d'), T = 1.3;
ctx.fillStyle = '#e8f1fc'; ctx.fillRect(0, 0, 1350, 1000);
var ids = (new URLSearchParams(location.search).get('ids') || 'rocking_seal,teddy_bear,toy_sled,table_low,beanbag,telescope').split(',');
ids.forEach(function (id, i) {
  var d = AB.furniture[id], x = 120 + (i % 4) * 320, y = 260 + Math.floor(i / 4) * 300;
  ctx.save(); ctx.translate(x, y); ctx.scale(2, 2); if (d.place === 'wall') ctx.translate(0, -50); d.draw(ctx, { t: T, rot: 0 }); ctx.restore();
});
// rugs rotations
['rug_stripe', 'rug_fish', 'rug_star'].forEach(function (id, r) {
  for (var k = 0; k < 4; k++) {
    var x = 110 + k * 220, y = 880 - (2 - r) * 0;
  }
});
document.title = 'done';
</script></body></html>
