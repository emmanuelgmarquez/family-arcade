<!doctype html>
<html><head><meta charset="utf-8"><title>Scene harness</title>
<style>html,body{margin:0;background:#1b2747}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="900"></canvas>
<script src="../js/core.js"></script><script src="../js/art.js"></script><script src="../js/icons.js"></script>
<script src="../js/characters.js"></script><script src="../js/furniture.js"></script><script src="../js/pet-art.js"></script><script src="../js/scenekit.js"></script>
<script>
// Usage: scene-harness.html?scene=lake[&debug=1][&t=3]
// debug=1 overlays the walkable grid (green), blocks (red), hotspots (yellow), prop hit boxes (cyan),
// spawns (magenta), npcSpots (blue), questSpots (orange).
var q = new URLSearchParams(location.search), id = q.get('scene') || 'town';
// minimal stubs so scene files load standalone
AB.world = { t: 0, player: { x: 0, y: 0 }, particles: [], burst: function () {}, say: function () {} };
AB.quests = { revealGem: function () {}, event: function () {}, tapSculpture: function () {} };
AB.game = { profile: { sculpture: [] } };
AB.audio = { sfx: function () {} };
AB.ui = {}; AB.go = function () {}; AB.playMinigame = function () {};
var s = document.createElement('script'); s.src = '../js/scenes/' + id + '.js'; s.onload = run; document.body.appendChild(s);
function run() {
  var sc = AB.scenes[id], ctx = document.getElementById('c').getContext('2d');
  var t = +(q.get('t') || 2);
  AB.world.t = t;
  sc.paint(ctx, 1280, 900);
  if (sc.aurora) AB.art.aurora(ctx, 1280, 30, 150, t, 0.3);
  if (sc.animate) sc.animate(ctx, t);
  var list = (sc.props || []).map(function (p) { return { y: p.y, f: function () { p.draw(ctx, t, p); } }; });
  // sample characters for scale at spawns and npc spots
  var sp = (sc.spawns && sc.spawns['default']) || [640, 700];
  var d = sc.depth || [300, 0.8, 880, 1.08];
  function sc2(y) { return d[1] + (d[3] - d[1]) * Math.max(0, Math.min(1, (y - d[0]) / (d[2] - d[0]))); }
  list.push({ y: sp[1], f: function () { AB.chars.draw(ctx, sp[0], sp[1], { species: 'penguin', palette: 'midnight', outfit: { neck: 'scarf_red' } }, { t: t, scale: sc2(sp[1]) }); } });
  Object.keys(sc.npcSpots || {}).forEach(function (k, i) {
    var n = sc.npcSpots[k];
    list.push({ y: n.at[1], f: function () { AB.chars.draw(ctx, n.at[0], n.at[1], { species: AB.chars.ORDER[(i + 2) % 6], palette: '', outfit: {} }, { t: t, scale: sc2(n.at[1]), dir: n.dir || 1 }); } });
  });
  list.sort(function (a, b) { return a.y - b.y; }).forEach(function (o) { o.f(); });
  if (sc.paintFront) sc.paintFront(ctx, 1280, 900);
  if (sc.overlay) sc.overlay(ctx, t);
  (sc.hotspots || []).forEach(function (h) { if (h.icon) { ctx.save(); ctx.translate(h.badge ? h.badge[0] : h.hit[0] + h.hit[2] / 2, h.badge ? h.badge[1] : h.hit[1] - 6); AB.icons.badge(ctx, h.icon); ctx.restore(); } });
  if (q.get('debug')) {
    ctx.save(); ctx.globalAlpha = 0.28;
    for (var y = 10; y < 900; y += 20) for (var x = 10; x < 1280; x += 20) {
      var ok = AB.util.pointInPoly(x, y, sc.walk) && !(sc.blocks || []).some(function (k) {
        return (k.e && AB.util.inEllipse(x, y, k.e[0], k.e[1], k.e[2], k.e[3])) || (k.r && x >= k.r[0] && x <= k.r[0] + k.r[2] && y >= k.r[1] && y <= k.r[1] + k.r[3]) || (k.p && AB.util.pointInPoly(x, y, k.p));
      });
      ctx.fillStyle = ok ? '#00ff66' : 'rgba(0,0,0,0)'; if (ok) ctx.fillRect(x - 9, y - 9, 18, 18);
    }
    ctx.restore();
    ctx.lineWidth = 3;
    (sc.blocks || []).forEach(function (k) { ctx.strokeStyle = 'red'; ctx.beginPath(); if (k.e) ctx.ellipse(k.e[0], k.e[1], k.e[2], k.e[3], 0, 0, 7); if (k.r) ctx.rect(k.r[0], k.r[1], k.r[2], k.r[3]); if (k.p) { ctx.moveTo(k.p[0][0], k.p[0][1]); k.p.forEach(function (p) { ctx.lineTo(p[0], p[1]); }); ctx.closePath(); } ctx.stroke(); });
    (sc.hotspots || []).forEach(function (h) { ctx.strokeStyle = 'yellow'; ctx.strokeRect(h.hit[0], h.hit[1], h.hit[2], h.hit[3]); ctx.fillStyle = 'yellow'; ctx.fillRect(h.at[0] - 6, h.at[1] - 6, 12, 12); ctx.font = '14px sans-serif'; ctx.fillText(h.id, h.hit[0] + 4, h.hit[1] + 16); });
    (sc.props || []).forEach(function (p) { if (p.hit) { ctx.strokeStyle = 'cyan'; ctx.strokeRect(p.hit[0], p.hit[1], p.hit[2], p.hit[3]); } });
    Object.keys(sc.spawns || {}).forEach(function (k) { var p = sc.spawns[k]; ctx.fillStyle = 'magenta'; ctx.fillRect(p[0] - 7, p[1] - 7, 14, 14); ctx.fillText(k, p[0] + 9, p[1]); });
    Object.keys(sc.npcSpots || {}).forEach(function (k) { var n = sc.npcSpots[k]; ctx.fillStyle = '#39f'; ctx.fillRect(n.at[0] - 7, n.at[1] - 7, 14, 14); ctx.fillText(k, n.at[0] + 9, n.at[1]); if (n.wander) { ctx.strokeStyle = '#39f'; ctx.strokeRect(n.wander[0], n.wander[1], n.wander[2], n.wander[3]); } });
    Object.keys(sc.questSpots || {}).forEach(function (k) { var p = sc.questSpots[k]; ctx.fillStyle = 'orange'; ctx.beginPath(); ctx.arc(p[0], p[1], 8, 0, 7); ctx.fill(); ctx.fillText(k, p[0] + 10, p[1]); });
  }
  document.title = 'ready';
}
</script></body></html>
