<!doctype html>
<html lang="en">
<head>

<style>
:root{--cream:#fff8ee;--paper:#fffdf9;--cocoa:#5a3828;--cocoa2:#8a6150;--line:#f0dcc6;--caramel:#f0b57a;--coral:#ff8f6e;--coral2:#f2735a;--mint:#7fd3b4;--mint2:#5cbf9b;--sky:#88c8f2;--lav:#b9a6ef;--sun:#ffd166;--pink:#ff9fc4;
--sh:0 5px 0 rgba(90,56,40,.16),0 10px 22px rgba(90,56,40,.16);--sh-sm:0 3px 0 rgba(90,56,40,.14),0 6px 14px rgba(90,56,40,.12);--r:26px;
--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f6e3c6;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--cocoa);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-text-size-adjust:100%}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:absolute;inset:0;pointer-events:none}
.layer>*{pointer-events:auto}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text;touch-action:manipulation}
svg{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:0 28px;border-radius:32px;background:var(--coral);color:#fff;font-weight:800;font-size:24px;box-shadow:0 6px 0 var(--coral2),0 12px 22px rgba(200,90,60,.25);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--coral2)}
.btn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint2),0 12px 22px rgba(60,160,120,.25)}
.btn.ghost{background:var(--paper);color:var(--cocoa);box-shadow:var(--sh-sm)}
.btn.small{min-height:52px;font-size:19px;padding:0 20px}
.btn.danger{background:#e8545a;box-shadow:0 6px 0 #c23c43}
.btn[disabled]{filter:grayscale(.7);opacity:.6;pointer-events:none}
.btn svg{width:30px;height:30px}
.round{width:64px;height:64px;border-radius:50%;background:var(--paper);box-shadow:var(--sh-sm);display:grid;place-items:center}
.round svg{width:36px;height:36px}
.round:active{transform:translateY(3px)}
/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(18px + var(--safe-t)) calc(24px + var(--safe-r)) calc(18px + var(--safe-b)) calc(24px + var(--safe-l))}
.logo{font-weight:900;font-size:64px;letter-spacing:-1px;color:#fff;-webkit-text-stroke:0;text-shadow:0 4px 0 #e98a5f,0 8px 0 rgba(90,56,40,.25),0 10px 30px rgba(90,56,40,.25);margin:6px 0 0;line-height:1}
.logo span{color:#ffe08a}
.sub{font-size:26px;font-weight:800;color:var(--cocoa);background:rgba(255,253,249,.85);padding:8px 22px;border-radius:30px;margin:14px 0 10px;box-shadow:var(--sh-sm)}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;max-width:1100px;padding:10px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card{width:168px;background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;padding:12px 10px 14px;gap:6px;position:relative;transition:transform .1s}
.card:active{transform:scale(.96)}
.card .nm{font-weight:900;font-size:22px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta svg{width:22px;height:22px}
.card .meta{font-size:15px;font-weight:700;color:var(--cocoa2);display:flex;gap:4px;align-items:center}
.card canvas{width:128px;height:128px;border-radius:50%}
.card.add{background:rgba(255,253,249,.7);border:4px dashed #e9c9a8;box-shadow:none;justify-content:center;min-height:200px}
.card.add .plus{width:84px;height:84px;border-radius:50%;background:var(--mint);display:grid;place-items:center;box-shadow:0 5px 0 var(--mint2)}
.card.add .plus svg{width:46px;height:46px}
.card.sel{outline:6px solid var(--sun)}
.pcard canvas{width:150px;height:120px;border-radius:20px;background:linear-gradient(#e8f6ff,#d9f0cf)}
.pcard{width:182px}
.hearts{display:flex;gap:2px}
.hearts i{width:14px;height:13px;display:block;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 22'><path d='M12 21C5 15 1 11 1 6.5A5.5 5.5 0 0 1 12 4a5.5 5.5 0 0 1 11 2.5C23 11 19 15 12 21z' fill='%23ff6f91'/></svg>") center/contain no-repeat}
.hearts i.off{filter:grayscale(1) opacity(.3)}
.corner{position:absolute;display:flex;gap:12px;align-items:center}
.corner.bl{left:calc(18px + var(--safe-l));bottom:calc(16px + var(--safe-b))}
.corner.br{right:calc(18px + var(--safe-r));bottom:calc(16px + var(--safe-b))}
.corner.tl{left:calc(18px + var(--safe-l));top:calc(14px + var(--safe-t))}
.corner.tr{right:calc(18px + var(--safe-r));top:calc(14px + var(--safe-t))}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:30px;padding:6px 16px 6px 8px;font-weight:900;font-size:24px;box-shadow:var(--sh-sm);min-height:52px}
.pill svg{width:38px;height:38px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-weight:800;font-size:16px;background:#fff1e2}
.ribbon{position:absolute;top:8px;right:8px;background:var(--lav);color:#fff;border-radius:14px;padding:3px 8px;font-size:12px;font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.side{position:absolute;right:calc(22px + var(--safe-r));top:calc(20px + var(--safe-t));bottom:calc(20px + var(--safe-b));width:min(470px,44vw);background:rgba(255,253,249,.96);border-radius:34px;box-shadow:var(--sh);padding:22px;display:flex;flex-direction:column;gap:14px;overflow:auto;touch-action:pan-y}
.side h2{margin:0;font-size:30px;font-weight:900}
.side h3{margin:4px 0 0;font-size:18px;font-weight:900;color:var(--cocoa2);text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sw{width:64px;height:64px;border-radius:50%;box-shadow:var(--sh-sm);position:relative;border:4px solid #fff}
.sw.sel{outline:5px solid var(--coral);outline-offset:2px}
.side.compact{gap:8px;padding:18px}.side.compact .sw{width:54px;height:54px}.side.compact .row{gap:9px}
.chip{min-height:56px;padding:0 20px;border-radius:28px;background:#fff1e2;font-weight:800;font-size:20px;box-shadow:var(--sh-sm)}
.chip.sel{background:var(--coral);color:#fff}
.namein{width:100%;font-size:34px;font-weight:900;text-align:center;padding:14px;border-radius:24px;border:4px solid var(--line);background:#fff;outline:none;color:var(--cocoa)}
.namein:focus{border-color:var(--coral)}
.grow{flex:1}
.back{position:absolute;left:calc(18px + var(--safe-l));top:calc(14px + var(--safe-t))}
/* HUD */
#hud .who{position:absolute;left:calc(14px + var(--safe-l));top:calc(12px + var(--safe-t));display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:40px;padding:6px 18px 6px 6px;box-shadow:var(--sh-sm);min-height:64px;max-width:52vw}
#hud .who canvas{width:52px;height:52px;border-radius:50%;flex:none}
#hud .who .on{font-weight:900;font-size:19px;white-space:nowrap}
#hud .who .pn{font-weight:900;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .who .dv{width:3px;height:36px;border-radius:2px;background:var(--line);margin:0 4px}
#hud .who .swap{width:34px;height:34px;flex:none;opacity:.7}
#needs{position:absolute;left:calc(18px + var(--safe-l));top:calc(88px + var(--safe-t));display:flex;gap:6px}
.need{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--v)*1%),rgba(255,255,255,.6) 0);box-shadow:0 2px 6px rgba(90,56,40,.15);transition:transform .2s}
.need>span{width:34px;height:34px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.need svg{width:24px;height:24px}
.need.low{animation:wig 1.6s infinite}
@keyframes wig{0%,100%{transform:rotate(0)}10%{transform:rotate(-10deg)}20%{transform:rotate(10deg)}30%{transform:rotate(0)}}
#hud .tr{position:absolute;right:calc(14px + var(--safe-r));top:calc(12px + var(--safe-t));display:flex;gap:12px;align-items:center}
#coins.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.18)}}
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--safe-b));display:flex;gap:8px;background:rgba(255,253,249,.92);padding:8px 12px;border-radius:40px;box-shadow:var(--sh)}
.dk{width:84px;height:84px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900;font-size:13.5px;color:var(--cocoa2);position:relative}
.dk svg{width:46px;height:46px;transition:transform .15s}
.dk:active svg{transform:scale(.88)}
.dk.on{background:#ffe9d6;color:var(--cocoa)}
.dk.flash{animation:bump .5s 3}
.dk .badge{position:absolute;top:4px;right:8px;min-width:22px;height:22px;border-radius:11px;background:var(--coral);color:#fff;font-size:13px;display:grid;place-items:center;padding:0 5px}
#tray{position:absolute;right:calc(12px + var(--safe-r));top:calc(88px + var(--safe-t));bottom:calc(124px + var(--safe-b));width:132px;background:rgba(255,253,249,.97);border-radius:32px;box-shadow:var(--sh);padding:10px;display:flex;flex-direction:column;gap:10px;align-items:center;animation:slin .25s}
@keyframes slin{from{transform:translateX(40px);opacity:0}}
#tray .items{display:flex;flex-direction:column;gap:10px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:4px;flex:1;min-height:0;align-items:center}
.ti{flex:none;width:104px;height:100px;border-radius:24px;background:#fff4e8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:900;position:relative;box-shadow:var(--sh-sm)}
.ti canvas{width:60px;height:60px}
.ti svg{width:54px;height:54px}
.ti.sel{background:var(--sun)}
.ti .ct{position:absolute;top:4px;right:6px;background:var(--paper);border-radius:10px;padding:0 6px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ti.dim{opacity:.45}
.ti.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08);background:#c9f2e2}}
.dots{display:flex;gap:3px}
.dots b{width:9px;height:9px;border-radius:50%;background:#ecd8c4}
.dots b.on{background:var(--coral)}
#hint{position:absolute;top:calc(14px + var(--safe-t));left:50%;transform:translateX(-50%);background:var(--paper);border-radius:30px;padding:8px 22px 8px 10px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;box-shadow:var(--sh);animation:pop .3s}
#hint svg{width:42px;height:42px}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
#gest{position:absolute;left:calc(18px + var(--safe-l));top:calc(150px + var(--safe-t));width:210px;background:rgba(255,253,249,.96);border-radius:30px;box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
#gest .gn{font-weight:900;font-size:24px;text-align:center}
#gest .gtip{font-weight:800;font-size:16px;color:var(--cocoa2)}
#gest .pad{width:170px;height:150px;border-radius:22px;background:#fff1e2;position:relative;overflow:hidden}
#gest .pad svg{position:absolute;inset:0;width:100%;height:100%}
#gest .finger{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(255,143,110,.85);box-shadow:0 0 0 8px rgba(255,143,110,.25)}
#treatBtn{animation:pulse .9s infinite}
#toast{position:absolute;top:calc(84px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--paper);border-radius:30px;padding:10px 22px 10px 12px;font-weight:900;font-size:21px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;animation:pop .3s}
.toast svg,.toast canvas{width:40px;height:40px}
.toast.warn{background:#fff3c4}
.coinfly{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;pointer-events:none;transition:transform .75s cubic-bezier(.5,-0.3,.6,1),opacity .2s .65s;z-index:50}
/* modals */
#modal{background:rgba(70,40,25,.35);display:flex;align-items:center;justify-content:center;pointer-events:auto}
.mbox{background:var(--cream);border-radius:36px;box-shadow:var(--sh);width:min(880px,calc(100vw - 40px));max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden;animation:mpop .25s}
@keyframes mpop{from{transform:scale(.9);opacity:0}}
.mhead{display:flex;align-items:center;gap:14px;padding:16px 18px 10px 24px}
.mhead h2{margin:0;font-size:32px;font-weight:900;flex:1}
.mbody{padding:6px 24px 24px;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:10px;padding:0 24px 10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.sitem{background:var(--paper);border-radius:26px;box-shadow:var(--sh-sm);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.sitem canvas{width:88px;height:88px}
.sitem .nm{font-weight:900;font-size:18px;line-height:1.1}
.price{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:20px}
.price svg{width:26px;height:26px}
.owned{font-weight:900;color:var(--mint2);font-size:16px}
.gateq{font-size:44px;font-weight:900;text-align:center;margin:8px 0 18px}
.gatea{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.gatea button{height:84px;border-radius:24px;background:var(--paper);box-shadow:var(--sh-sm);font-size:34px;font-weight:900}
.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.plist{display:flex;flex-direction:column;gap:12px}
.prow{background:var(--paper);border-radius:22px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh-sm);flex-wrap:wrap}
.prow canvas{width:52px;height:52px;border-radius:50%}
.prow .nm{font-weight:900;font-size:22px;min-width:110px}
.pchip{display:inline-flex;align-items:center;gap:6px;background:#fff1e2;border-radius:20px;padding:4px 6px 4px 14px;font-weight:800;font-size:16px}
.pchip button{width:40px;height:40px;border-radius:50%;background:#ffd9d0;display:grid;place-items:center}
.pchip button svg{width:20px;height:20px}
.note{font-size:16px;font-weight:700;color:var(--cocoa2);line-height:1.35}
.sect{margin:18px 0 8px;font-size:20px;font-weight:900}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-radius:22px;padding:12px 18px;box-shadow:var(--sh-sm);font-weight:900;font-size:22px;gap:14px}
.toggle .sw2{width:76px;height:44px;border-radius:22px;background:#e6d5c4;position:relative;transition:background .2s}
.toggle .sw2::after{content:'';position:absolute;top:4px;left:4px;width:36px;height:36px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.toggle .sw2.on{background:var(--mint)}
.toggle .sw2.on::after{left:36px}
#rotate{position:absolute;inset:0;background:#f6e3c6;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;font-weight:900;font-size:28px;z-index:99;text-align:center;padding:30px}
@media (orientation:portrait) and (max-width:900px){#rotate.want{display:flex}}
.mstat{position:absolute;left:50%;transform:translateX(-50%);top:calc(14px + var(--safe-t));display:flex;gap:10px;align-items:center}

/* Inside Family Arcade: keep clear of the arcade's floating return button, whichever corner it's in */
body[data-fa="tl"] #hud .who,body[data-fa="tl"] .back,body[data-fa="tl"] .corner.tl{left:calc(84px + var(--safe-l))}
body[data-fa="tr"] #hud .tr,body[data-fa="tr"] .corner.tr{right:calc(84px + var(--safe-r))}
body[data-fa="bl"] .corner.bl{left:calc(84px + var(--safe-l))}
body[data-fa="br"] .corner.br{right:calc(84px + var(--safe-r))}
</style>

<body>
<canvas id="world"></canvas>
<div id="screens" class="layer"></div>
<div id="hud" class="layer hidden">
  <button class="who" data-act="switcher"><canvas id="hudAva"></canvas><span class="on" id="hudOwner"></span><span class="dv"></span><canvas id="hudPet"></canvas><span><span class="pn" id="hudPetName"></span><span class="hearts" id="hudHearts"></span></span><span class="swap" id="hudSwap"></span></button>
  <div id="needs"></div>
  <div class="tr"><div class="pill" id="coins"><span id="coinIcon"></span><span id="coinN">0</span></div><button class="round" data-act="settings" id="gearBtn" aria-label="Settings"></button></div>
  <div id="mstat" class="mstat hidden"></div>
  <div id="gest" class="hidden"></div>
  <div id="tray" class="hidden"></div>
  <div id="dock"></div>
</div>
<div id="hintLayer" class="layer" style="pointer-events:none"><div id="hint" class="hidden"></div><div id="toast"></div></div>
<div id="modal" class="layer hidden"></div>
<div id="rotate"><div id="rotIcon"></div>Turn your iPad sideways<br>for the best fun!<button class="btn small ghost" onclick="this.parentNode.classList.remove('want')">Play anyway</button></div>
<script>
'use strict';
/* ============================================================
   CORE UTILITIES
   ============================================================ */
const TAU = Math.PI * 2;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - (1 - t) * (1 - t);
const approach = (v, t, rate, dt) => v + (t - v) * (1 - Math.exp(-rate * dt));
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const now = () => Date.now();
function uid(p) { return p + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }
function hashStr(s) { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function hexRgb(h) { h = String(h).replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbHex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
const _shadeCache = new Map();
function shade(h, a) {
  const k = h + '|' + a; let v = _shadeCache.get(k); if (v) return v;
  const c = hexRgb(h);
  v = a >= 0 ? rgbHex(c[0] + (255 - c[0]) * a, c[1] + (255 - c[1]) * a, c[2] + (255 - c[2]) * a)

/* ============================================================
   PERSISTENCE — IndexedDB (preferred) → localStorage → memory
   Owners and pets are separate records keyed by id, so a
   problem with one record never touches another.
   ============================================================ */
const DB_NAME = 'snugglewood-pets', DB_VER = 1, SCHEMA = 1;
const MAX_OWNERS = 12, MAX_PETS = 8;

const Backend = {
  mode: 'memory', db: null, mem: { owners: {}, pets: {}, meta: {} }, lsPrefix: 'snugglewood:v1:',
  async init() {
    try {
      if (!window.indexedDB) throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const rq = indexedDB.open(DB_NAME, DB_VER);
        rq.onupgradeneeded = () => {
          const db = rq.result;
          if (!db.objectStoreNames.contains('owners')) db.createObjectStore('owners', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('pets')) { const s = db.createObjectStore('pets', { keyPath: 'id' }); s.createIndex('ownerId', 'ownerId'); }
          if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' });
        };
        rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); rq.onblocked = () => rej(new Error('blocked'));
        setTimeout(() => rej(new Error('idb timeout')), 4000);
      });
      this.db.onversionchange = () => { this.db.close(); };
      this.mode = 'idb';
    } catch (e) {
      try { localStorage.setItem(this.lsPrefix + 'probe', '1'); localStorage.removeItem(this.lsPrefix + 'probe'); this.mode = 'local'; }
      catch (e2) { this.mode = 'memory'; }
    }
    try { if (navigator.storage && navigator.storage.persist) this.persisted = await navigator.storage.persist(); } catch (e) { }
    return this.mode;
  },
  async getAll(store) {
    if (this.mode === 'idb') return new Promise((res, rej) => { const rq = this.db.transaction(store).objectStore(store).getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => rej(rq.error); });
    if (this.mode === 'local') {
      const out = [], p = this.lsPrefix + store + ':';
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(p)) { try { out.push(JSON.parse(localStorage.getItem(k))); } catch (e) { out.push({ __raw: localStorage.getItem(k), __key: k }); } } }
      return out;
    }
    return Object.values(this.mem[store]).map(x => JSON.parse(x));
  },
  // ops: [{store, put: rec} | {store, del: id}]
  async write(ops) {
    if (!ops.length) return;
    if (this.mode === 'idb') return new Promise((res, rej) => {
      const stores = [...new Set(ops.map(o => o.store))]; const tx = this.db.transaction(stores, 'readwrite');
      for (const o of ops) { const s = tx.objectStore(o.store); if (o.put) s.put(o.put); else s.delete(o.del); }
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('aborted'));
    });
    for (const o of ops) {
      const key = o.put ? (o.put.id ?? o.put.k) : o.del;
      if (this.mode === 'local') { const k = this.lsPrefix + o.store + ':' + key; if (o.put) localStorage.setItem(k, JSON.stringify(o.put)); else localStorage.removeItem(k); }
      else { if (o.put) this.mem[o.store][key] = JSON.stringify(o.put); else delete this.mem[o.store][key]; }
    }
  },
};

/* ---------- sanitizers: fill defaults, clamp values, never throw ---------- */
const num = (v, d, a = -Infinity, b = Infinity) => (typeof v === 'number' && isFinite(v)) ? clamp(v, a, b) : d;
const str = (v, d, max = 40) => (typeof v === 'string' && v.trim()) ? v.slice(0, max) : d;
function sanitizeOwner(o) {
  if (!o || typeof o !== 'object' || typeof o.id !== 'string' || !o.id.startsWith('own_')) return null;
  const av = o.avatar || {};
  const inv = o.inv || {};
  return {
    id: o.id, v: SCHEMA, name: str(o.name, 'Friend', 16),
    avatar: { skin: num(av.skin, 0, 0, AVATAR.skins.length - 1) | 0, hair: num(av.hair, 0, 0, AVATAR.hairs.length - 1) | 0, hairCol: num(av.hairCol, 0, 0, AVATAR.hairCols.length - 1) | 0, bg: num(av.bg, 0, 0, AVATAR.bgs.length - 1) | 0 },
    coins: num(o.coins, 30, 0, 999999) | 0,
    inv: {
      treats: objCounts(inv.treats, 'treat'), decor: objCounts(inv.decor, 'decor'),
      toys: arrItems(inv.toys, 'toy'), acc: arrItems(inv.acc, 'acc'),
    },
    seen: (o.seen && typeof o.seen === 'object') ? { ...o.seen } : {},
    lastPetId: typeof o.lastPetId === 'string' ? o.lastPetId : null,
    created: num(o.created, now()), updated: num(o.updated, now()),
  };
}
function objCounts(x, type) { const out = {}; if (x && typeof x === 'object') for (const k in x) if (ITEMS[k] && ITEMS[k].type === type) out[k] = num(x[k], 0, 0, 999) | 0; return out; }
function arrItems(x, type) { return Array.isArray(x) ? [...new Set(x.filter(k => ITEMS[k] && ITEMS[k].type === type))] : []; }
function sanitizePet(p) {
  if (!p || typeof p !== 'object' || typeof p.id !== 'string' || !p.id.startsWith('pet_') || typeof p.ownerId !== 'string') return null;
  const sp = SPECIES[p.species]; if (!sp) return null;
  const lk = p.look || {}; const n = p.needs || {}; const rm = p.room || {};
  const opts = {}; for (const k in sp.opts) opts[k] = sp.opts[k].includes((lk.opts || {})[k]) ? lk.opts[k] : sp.opts[k][0];
  const tricks = {}; if (p.tricks && typeof p.tricks === 'object') for (const t in p.tricks) if (sp.tricks.includes(t)) tricks[t] = num(p.tricks[t], 0, 0, 100);
  const acc = {}; if (p.acc && typeof p.acc === 'object') for (const s of ['head', 'neck']) if (ITEMS[p.acc[s]] && ITEMS[p.acc[s]].slot === s) acc[s] = p.acc[s];
  return {
    id: p.id, v: SCHEMA, ownerId: p.ownerId, species: p.species, name: str(p.name, sp.label, 16),
    look: { pal: num(lk.pal, 0, 0, sp.palettes.length - 1) | 0, pattern: sp.patterns.includes(lk.pattern) ? lk.pattern : sp.patterns[0], opts },
    personality: PERSONALITIES[p.personality] ? p.personality : 'playful',
    needs: { food: num(n.food, 80, 0, 100), water: num(n.water, 80, 0, 100), clean: num(n.clean, 85, 0, 100), energy: num(n.energy, 90, 0, 100), fun: num(n.fun, 70, 0, 100), love: num(n.love, 70, 0, 100) },
    bond: num(p.bond, 0, 0, 1000), tricks, acc,
    room: {
      theme: THEMES.some(t => t.id === rm.theme) ? rm.theme : 'peach',
      items: Array.isArray(rm.items) ? rm.items.filter(i => i && ITEMS[i.item] && ITEMS[i.item].type === 'decor').slice(0, 30).map(i => ({ uid: str(i.uid, uid('d')), item: i.item, x: num(i.x, .5, 0, 1), y: num(i.y, 560, 380, 720) })) : [],
    },
    stats: { ...(p.stats || {}) },
    lastSeen: num(p.lastSeen, now()), lastGift: num(p.lastGift, 0), created: num(p.created, now()), updated: num(p.updated, now()),
  };
}

/* ---------- Data: in-memory cache + debounced writes ---------- */
const Data = {
  owners: new Map(), pets: new Map(), meta: {}, problems: [], dirty: new Set(), deletes: [], timer: null, saving: false, lastError: null,
  async load() {
    await Backend.init();
    this.problems = [];
    let owners = [], pets = [], meta = [];
    try { owners = await Backend.getAll('owners'); pets = await Backend.getAll('pets'); meta = await Backend.getAll('meta'); }
    catch (e) { this.problems.push({ kind: 'read', msg: 'Could not read saves: ' + e.message }); }
    for (const raw of owners) { const o = sanitizeOwner(raw); if (o) this.owners.set(o.id, o); else this.problems.push({ kind: 'owner', raw, msg: 'An owner save could not be read. It was left untouched.' }); }
    for (const raw of pets) {
      const p = sanitizePet(raw);
      if (!p) { this.problems.push({ kind: 'pet', raw, msg: 'A pet save could not be read. It was left untouched.' }); continue; }
      if (!this.owners.has(p.ownerId)) { p.orphan = true; this.problems.push({ kind: 'orphan', petId: p.id, msg: `${p.name} (${SPECIES[p.species].label}) has no owner profile.` }); }
      this.pets.set(p.id, p);
    }
    for (const m of meta) if (m && m.k) this.meta[m.k] = m.v;
    return this;
  },
  ownersList() { return [...this.owners.values()].sort((a, b) => a.created - b.created); },
  petsOf(ownerId) { return [...this.pets.values()].filter(p => p.ownerId === ownerId && !p.orphan).sort((a, b) => a.created - b.created); },
  touch(rec) { rec.updated = now(); this.dirty.add(rec.id); this.schedule(); },
  setMeta(k, v) { this.meta[k] = v; this.dirty.add('meta:' + k); this.schedule(); },
  schedule() { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 350); },
  async flush() {
    clearTimeout(this.timer);
    if (this.saving) { this.schedule(); return; }
    const ops = [...this.deletes]; this.deletes = [];
    for (const id of this.dirty) {
      if (id.startsWith('meta:')) { const k = id.slice(5); ops.push({ store: 'meta', put: { k, v: this.meta[k] } }); continue; }
      const o = this.owners.get(id); if (o) { ops.push({ store: 'owners', put: JSON.parse(JSON.stringify(o)) }); continue; }
      const p = this.pets.get(id); if (p) { const c = JSON.parse(JSON.stringify(p)); delete c.orphan; ops.push({ store: 'pets', put: c }); }
    }
    this.dirty.clear(); if (!ops.length) return;
    this.saving = true;
    try { await Backend.write(ops); this.lastError = null; window.dispatchEvent(new Event('saved')); }
    catch (e) {
      this.lastError = e; for (const o of ops) if (o.put) this.dirty.add(o.store === 'meta' ? 'meta:' + o.put.k : o.put.id); else this.deletes.push(o);
      UI && UI.toast && UI.toast('Saving had a hiccup — will retry', 'warn');
      setTimeout(() => this.flush(), 3000);
    }
    finally { this.saving = false; }
  },
  newOwner(name, avatar) {
    const o = sanitizeOwner({ id: uid('own'), name, avatar, coins: 30, created: now() });
    this.owners.set(o.id, o); this.touch(o); return o;
  },
  newPet(ownerId, species, look, name, personality) {
    const sp = SPECIES[species];
    const items = [...HABITAT_DEFAULTS[sp.habitat], ...(SPECIES_EXTRA_DECOR[species] || [])].map(i => ({ uid: uid('d'), ...i }));
    const p = sanitizePet({ id: uid('pet'), ownerId, species, look, name, personality, bond: 20, room: { theme: pick(THEMES).id, items }, needs: { food: 70, water: 70, clean: 90, energy: 95, fun: 60, love: 60 }, created: now(), lastSeen: now() });
    this.pets.set(p.id, p);

    this.pets = datas.slice(0, 5).map((d, i) => { const p = new Pet({ ...d, needs: { ...d.needs, energy: 100 }, stats: {}, room: { items: [] } }, this); p.x = lerp(this.bounds.x0, this.bounds.x1, (i + .5) / Math.min(5, datas.length)); p.y = rand(this.bounds.y0, this.bounds.y1); p.facing = i % 2 ? -1 : 1; return p; });
  }
  paintBg(c, W, H) { paintMeadow(c, W, H); }
  depth(y) { return .62; }
  update(dt) { super.update(dt); for (const p of this.pets) { p.update(dt); p.d.needs.energy = 100; } }
  draw(c) { this.drawBg(c); [...this.pets].sort((a, b) => a.y - b.y).forEach(p => p.draw(c, p.x, p.y, p.scale)); this.drawParts(c); for (const p of this.pets) p.drawEmote(c); vignette(c, Game.W, Game.H, .12); }
  down(p) { for (const pt of this.pets) if (pt.hitTest(p.x, p.y)) { pt.state = 'busy'; pt.act('happy', 1, () => { pt.state = 'idle'; }); Sound.voice(pt.d.species); this.burst('heart', p.x, p.y, 3); } }

   AVATARS
   ============================================================ */
function drawAvatar(cv, av, size) {
  const dpr = Math.min(2, window.devicePixelRatio || 1), S = size || cv.clientWidth || 100;
  cv.width = S * dpr; cv.height = S * dpr; const c = cv.getContext('2d'); c.setTransform(dpr * S / 100, 0, 0, dpr * S / 100, 0, 0);
  const skin = AVATAR.skins[av.skin] || AVATAR.skins[0], hc = AVATAR.hairCols[av.hairCol] || AVATAR.hairCols[0], bg = AVATAR.bgs[av.bg] || AVATAR.bgs[0], hair = AVATAR.hairs[av.hair] || 'short';
  c.save(); E(c, 50, 50, 50, 50); c.clip();
  const g = c.createRadialGradient(40, 30, 5, 50, 50, 70); g.addColorStop(0, shade(bg, .3)); g.addColorStop(1, bg); c.fillStyle = g; c.fillRect(0, 0, 100, 100);
  const OLs = OL; OL = 1.6;
  if (hair === 'long' || hair === 'bob') { c.fillStyle = hc; roundRect(c, 22, 30, 56, hair === 'long' ? 66 : 42, 24); c.fill(); }
  if (hair === 'pigtails') { blob(c, 20, 52, 11, 14, hc); blob(c, 80, 52, 11, 14, hc); flat(c, 25, 44, 4, 4, '#ff6f91'); flat(c, 75, 44, 4, 4, '#ff6f91'); }
  c.fillStyle = shade(bg, -.25); E(c, 50, 104, 34, 22); c.fill();
  blob(c, 50, 74, 9, 9, skin, 0, { ol: false });
  blob(c, 50, 50, 25, 26, skin);
  c.fillStyle = hc;
  if (hair === 'short' || hair === 'bob' || hair === 'long' || hair === 'pigtails') { c.beginPath(); c.ellipse(50, 42, 27, 22, 0, Math.PI * 1.02, Math.PI * 1.98); c.quadraticCurveTo(70, 38, 50, 36); c.quadraticCurveTo(36, 40, 23, 46); c.fill(); }
  if (hair === 'curly') for (let i = 0; i < 9; i++) { const a = Math.PI * (1.02 + i * .12); E(c, 50 + Math.cos(a) * 24, 46 + Math.sin(a) * 22, 9, 9); c.fill(); }
  if (hair === 'bun') { c.beginPath(); c.ellipse(50, 42, 27, 21, 0, Math.PI, TAU); c.fill(); E(c, 50, 18, 12, 11); c.fill(); }
  if (hair === 'spiky') { c.beginPath(); c.moveTo(23, 46); for (let i = 0; i <= 6; i++) { c.lineTo(25 + i * 8.5, i % 2 ? 26 : 16); } c.lineTo(77, 46); c.quadraticCurveTo(50, 32, 23, 46); c.fill(); }
  if (hair === 'cap') { c.beginPath(); c.ellipse(50, 40, 27, 20, 0, Math.PI, TAU); c.fill(); roundRect(c, 46, 34, 40, 8, 4); c.fill(); flat(c, 50, 22, 4, 3, '#fff'); }
  c.fillStyle = '#3a2418'; E(c, 41, 52, 3.4, 4.2); c.fill(); E(c, 59, 52, 3.4, 4.2); c.fill(); c.fillStyle = '#fff'; E(c, 40, 50.5, 1.2, 1.2); c.fill(); E(c, 58, 50.5, 1.2, 1.2); c.fill();
  flat(c, 36, 60, 5, 3, '#ff8fa3', 0, .5); flat(c, 64, 60, 5, 3, '#ff8fa3', 0, .5);
  c.strokeStyle = '#3a2418'; c.lineWidth = 2.4; c.lineCap = 'round'; c.beginPath(); c.arc(50, 59, 7, .25 * Math.PI, .75 * Math.PI); c.stroke();
  OL = OLs; c.restore();
}

/* ============================================================
   UI — screens, HUD, trays, modals
   ============================================================ */
const UI = {
  minis: [], mode: 'hand', panel: null,
  el: id => document.getElementById(id),
  screen(html) { const s = this.el('screens'); this.minis = this.minis.filter(m => m.persist); s.innerHTML = html ? `<div class="screen">${html}</div>` : ''; },
  addMini(canvas, data, opts = {}) { const cr = new Critter(data); const m = { canvas, cr, opts, persist: !!opts.persist }; this.minis.push(m); return m; },
  drawMinis(dt) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.minis = this.minis.filter(m => m.canvas.isConnected);
    for (const m of this.minis) {
      const cv = m.canvas, w = cv.clientWidth, h = cv.clientHeight; if (!w) continue;
      if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
      m.cr.puppet(dt); const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
      if (m.opts.bg) { c.fillStyle = m.opts.bg; c.fillRect(0, 0, w, h); }
      const box = m.cr.sp.box, fit = m.opts.face ? Math.min(w / (box[0] * .7), h / (box[1] * .62)) : Math.min(w / (box[0] * 1.25), h / (box[1] * 1.12));
      const yb = m.opts.face ? h + box[1] * fit * .18 : h * .93;
      m.cr.draw(c, w * .5 - (m.opts.face ? box[0] * fit * .18 : 0), yb, fit);
    }
  },
  /* ---------- owner select ---------- */
  owners() {
    const list = Data.ownersList();
    let cards = list.map(o => { const n = Data.petsOf(o.id).length; return `<button class="card" data-act="pickOwner" data-id="${o.id}"><canvas data-ava="${o.id}"></canvas><span class="nm">${esc(o.name)}</span><span class="meta">${icon('paw', 'mi')}<b>${n}</b></span></button>`; }).join('');
    if (list.length < MAX_OWNERS) cards += `<button class="card add" data-act="newOwner"><span class="plus">${icon('plus')}</span><span class="nm">New player</span></button>`;
    const probs = Data.problems.length ? `<span class="tag" style="background:#fff3c4">Grown-ups: ${Data.problems.length} save note${Data.problems.length > 1 ? 's' : ''}</span>` : '';
    this.screen(`<div class="logo">Snuggle<span>wood</span></div><div class="sub">${list.length ? "Who's playing?" : 'Welcome! Make a player to start.'}</div><div class="cards scroll">${cards}</div>
      <div class="corner bl"><button class="pill" data-act="grownups" style="font-size:18px">${icon('lock')}Grown-ups</button>${probs}</div>
      <div class="corner br"><button class="round" data-act="toggleMusic" aria-label="Music">${icon('music')}</button><button class="round" data-act="toggleSfx" aria-label="Sounds">${icon('sound')}</button></div>`);
    $$('canvas[data-ava]').forEach(cv => { cv.style.width = cv.style.height = '128px'; drawAvatar(cv, Data.owners.get(cv.dataset.ava).avatar, 128); });
    this.syncSoundBtns();
  },
  /* ---------- create owner ---------- */
  createOwner() {
    const st = this.newOwnerState = { name: '', av: { skin: randi(0, 5), hair: randi(0, 7), hairCol: randi(0, 6), bg: randi(0, 7) } };
    const sw = (key, arr) => arr.map((col, i) => `<button class="sw" data-act="av" data-k="${key}" data-i="${i}" style="background:${col}"></button>`).join('');

  gateAns(b) { const g = UI._gate; if (!g) return; if (+b.dataset.v === g.ans) { UI._gate = null; g.cb(); } else { const a = UI.el('gateA'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); Sound.play('hmm'); setTimeout(() => UI.gate(g.cb), 500); } },
  parentBack() { UI.parentArea(); },
  async delPet(b) { const p = Data.pets.get(b.dataset.id); if (!p) return; if (await UI.confirm('Delete pet?', `Say goodbye to <b>${esc(p.name)}</b>? This cannot be undone. (Tip: save a backup file first.)`, 'Delete')) { if (Game.petData && Game.petData.id === p.id) { Game.petData = null; } Data.deletePet(p.id); await Data.flush(); UI.toast('Pet removed'); afterParentChange(); } else UI.parentArea(); },
  async delOwner(b) { const o = Data.owners.get(b.dataset.id); if (!o) return; const n = Data.petsOf(o.id).length; if (await UI.confirm('Delete player?', `Delete <b>${esc(o.name)}</b> and their ${n} pet(s)? This cannot be undone. (Tip: save a backup file first.)`, 'Delete')) { Data.deleteOwner(o.id); await Data.flush(); UI.toast('Player removed'); if (Game.owner && Game.owner.id === o.id) { Game.owner = null; Game.petData = null; } afterParentChange(); } else UI.parentArea(); },
  async resetAll() { if (await UI.confirm('Erase everything?', 'This deletes <b>all players and pets</b> on this device. Save a backup file first if you might want them back.', 'Erase all')) { if (await UI.confirm('Are you really sure?', 'Last check — everything will be erased.', 'Yes, erase')) { await Data.resetAll(); Game.owner = null; Game.petData = null; UI.toast('All saves erased'); Game.goOwners(); } else UI.parentArea(); } else UI.parentArea(); },
  export() { Game.exportBackup(); },
  async importDo(b) { const bk = UI._import; if (!bk) return; await Data.applyBackup(bk, b.dataset.k); UI._import = null; UI.toast(`Loaded ${bk.pets.length} pet(s)!`, 'star'); Game.owner = null; Game.petData = null; Game.goOwners(); },
  adoptOrphan(b) { const p = Data.pets.get(b.dataset.id), sel = $(`select[data-orphan="${b.dataset.id}"]`); if (!p || !sel) return; p.ownerId = sel.value; delete p.orphan; Data.problems = Data.problems.filter(x => x.petId !== p.id); Data.touch(p); UI.parentArea(); },
  // ---- in-game ----
  dock(b) {
    const k = b.dataset.k, sc = Game.scene; Sound.play('tap');
    if (UI.modalOpen) UI.closeModal();
    if (sc instanceof MeadowScene) { if (k === 'home') return Game.enterPet(Game.petData); if (k === 'shop') return UI.shop('toy'); sc.setActivity(k); if (k === 'course') UI.hint('course'); if (k === 'hunt') UI.hint('hunt'); return; }
    if (!(sc instanceof HomeScene)) return;
    if (UI.panel === k) { UI.setMode('hand'); UI.closeTray(); return; }
    if (sc.mode !== 'hand' && k !== 'shop') UI.setMode('hand');
    switch (k) {
      case 'food': UI.trayBuilders.food(); break;
      case 'water': sc.fillBowl('water'); UI.closeTray(); break;
      case 'clean': UI.trayBuilders.clean(); break;
      case 'toys': UI.cupboard('toy'); break;
      case 'tricks': UI.setMode('trick'); sc.mode = 'trick'; UI.trayBuilders.tricks(); if (!sc.trick) Actions.trick({ dataset: { k: SPECIES[Game.petData.species].tricks.find(t => (Game.petData.tricks[t] || 0) < 100) || SPECIES[Game.petData.species].tricks[0] } }); break;
      case 'decor': UI.setMode('decor'); UI.trayBuilders.decor(); UI.hint('decor'); break;
      case 'shop': UI.shop(); break;
      case 'outside': Game.goMeadow(); break;
    }
  },
  closeTray() { UI.setMode('hand'); UI.closeTray(); const sc = Game.scene; if (sc instanceof MeadowScene && sc.activity === 'fetch') sc.setActivity('explore'); },
  feed(b) { const sc = Game.scene; if (b.dataset.k === 'basic') { sc.fillBowl('food'); UI.closeTray(); } else { UI.closeTray(); sc.startTreat(b.dataset.k); } },
  tool(b) { const k = b.dataset.k; UI.setMode(k); UI.trayBuilders.clean(); UI.hint(k === 'wash' ? 'wash' : k === 'rinse' ? 'rinse' : 'brush'); },
  trick(b) { const sc = Game.scene; sc.mode = 'trick'; UI.mode = 'trick'; sc.startTrick(b.dataset.k); UI.trayBuilders.tricks(); },
  trickTreat() { Game.scene.treatButton(); },
  placeDecor(b) { const o = Game.owner, id = b.dataset.k; if (!(o.inv.decor[id] > 0)) return; o.inv.decor[id]--; if (!o.inv.decor[id]) delete o.inv.decor[id]; Data.touch(o); Game.scene.placeDecor(id); UI.trayBuilders.decor(); },
  removeDecor() { const sc = Game.scene, d = sc.selDecor; if (!d) return; const o = Game.owner; o.inv.decor[d.item] = (o.inv.decor[d.item] || 0) + 1; Data.touch(o); sc.removeDecor(); UI.trayBuilders.decor(); },
  theme(b) { Game.scene.setTheme(b.dataset.k); Sound.play('tap'); UI.trayBuilders.decor(); },
  shopTab(b) { UI.shop(b.dataset.k); },
  buy(b) {
    const o = Game.owner, id = b.dataset.k, it = ITEMS[id]; if (!it || o.coins < it.price) return;
    o.coins -= it.price;
    if (it.type === 'treat') o.inv.treats[id] = (o.inv.treats[id] || 0) + 1; else if (it.type === 'decor') o.inv.decor[id] = (o.inv.decor[id] || 0) + 1; else if (it.type === 'toy') { if (!o.inv.toys.includes(id)) o.inv.toys.push(id); } else if (it.type === 'acc') { if (!o.inv.acc.includes(id)) o.inv.acc.push(id); }
    Data.touch(o); Sound.play('buy'); UI.coins(o.coins); UI.shop(UI.shopTab); UI.toast(`Got ${it.label}!`, 'gift', id);
  },
  cupTab(b) { UI.cupboard(b.dataset.k); },
  spawnToy(b) {
    const sc = Game.scene, id = b.dataset.k; UI.closeModal();
    sc.toys = sc.toys.filter(t => t.held === 'pet'); const t = sc.spawnToy(id, Game.W * .5 + rand(-60, 60), sc.bounds.y1); t.z = 0; t.rest = true; Sound.play('pop'); sc.burst('sparkle', t.x, t.y - 20, 6); UI.hint('throw');
    const pet = sc.pet; pet.lookAt = t; pet.r.earFlick = 1;
  },
  wear(b) { const pd = Game.petData, id = b.dataset.k, slot = ITEMS[id].slot; if (pd.acc[slot] === id) delete pd.acc[slot]; else pd.acc[slot] = id; Data.touch(pd); Game.scene.pet.refreshLook(); Sound.play('sparkle'); UI.cupboard('acc'); if (UI.hudMini) UI.hudMini.cr.refreshLook(); Game.scene.pet.state = 'busy'; Game.scene.pet.act('happy', .9, () => { Game.scene.pet.state = 'idle'; }); },
  activity(b) { Game.scene.setActivity(b.dataset.k); },
  courseGo() { Game.scene.startCourse(); },
};
function afterParentChange() { if (Game.owner && !Data.owners.has(Game.owner.id)) Game.owner = null; if (Game.petData && !Data.pets.has(Game.petData.id)) Game.petData = null; if (!Game.owner || (!Game.petData && !(Game.scene instanceof AttractScene))) { Game.goOwners().then(() => UI.parentArea()); } else { if (Game.scene instanceof AttractScene && !Game.petData) Game.goPets(Game.owner); UI.parentArea(); } }

/* ---------- boot ---------- */
(async function boot() {
  Game.init();
  try { await Data.load(); } catch (e) { console.error(e); }
  if (Data.meta.music === false) Sound.musicOn = false; if (Data.meta.sfx === false) Sound.sfxOn = false;
  if (Backend.mode === 'memory') setTimeout(() => UI.toast('Saving is off in this browser mode', 'warn'), 800);
  if (Data.problems.length) setTimeout(() => UI.toast('Some saves need a grown-up look', 'warn'), 1200);
  Game.setScene(new AttractScene(null));
  const last = Data.meta.lastOwnerId && Data.owners.get(Data.meta.lastOwnerId);
  UI.owners();
  // Running inside Family Arcade? Track which corner its return button is in so our buttons move out of its way.
  try {
    if (window.FamilyArcade || window.__FA_RUNTIME__) {
      document.body.dataset.fa = 'tl';
      const pd = window.parent !== window && window.parent.document, btn = pd && pd.querySelector('.home-btn');
      if (btn) { const sync = () => { document.body.dataset.fa = btn.dataset.corner || 'tl'; }; sync(); new MutationObserver(sync).observe(btn, { attributes: true, attributeFilter: ['data-corner'] }); }
    }
  } catch (e) { }
  window.__snug = { Game, Data, UI, Backend, Actions };
  // standalone offline support: only when no other service worker (e.g. the arcade's) already controls this page
  try { if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !navigator.serviceWorker.controller && !/[?&]embedded/.test(location.search)) navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { }
})();

</script>
