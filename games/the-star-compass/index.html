[hidden]{display:none!important}
/* Layout: a fixed 1000x625 "CD-ROM window" stage, scaled to fit, with a carved wood toolbar along the bottom. */
:root{
  --ink:#2a1b12; --parch:#f6e6bd; --parch-2:#e4c88f; --parch-edge:#b78a4a;
  --wood:#7a4a26; --wood-dk:#4a2810; --brass:#e0a743; --brass-dk:#8c5a1c; --brass-lt:#ffe7a3;
  --teal:#2fb3a6; --night:#140f24; --night-2:#2a1f4a; --cream:#fff8e6; --berry:#c8432d; --leaf:#3f8f4a;
  --display:'Luckiest Guy','Arial Black',Impact,sans-serif;
  --body:'Andika','Trebuchet MS',Verdana,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 30%,var(--night-2),var(--night) 70%);color:var(--cream);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#wrap{position:fixed;inset:0;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:absolute;left:50%;top:50%;width:1000px;height:625px;transform-origin:50% 50%;overflow:hidden;border-radius:12px;
  background:#000;box-shadow:0 0 0 3px #3b220e,0 0 0 7px #b37a33,0 0 0 9px #3b220e,0 20px 60px rgba(0,0,0,.7);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.screen{position:absolute;inset:0}
svg{display:block}
svg text{font-family:var(--body)}
button{font-family:var(--display);cursor:pointer}
button:focus-visible,.hot:focus-visible,[tabindex]:focus-visible{outline:3px solid #fff3a0;outline-offset:2px}

/* ---------- big storybook buttons ---------- */
.btn{font-size:24px;letter-spacing:.02em;color:#3b1d06;padding:12px 28px;border-radius:40px;border:3px solid #3b220e;
  background:linear-gradient(#ffe39a,#f2b648 55%,#c98523);box-shadow:0 5px 0 #6b3d14,inset 0 2px 0 #fff4c8;text-shadow:0 1px 0 #ffeec0;transition:transform .08s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #6b3d14}
.btn.teal{background:linear-gradient(#9ff0e2,#3cc4b2 55%,#1f8a7c);color:#05302a;text-shadow:0 1px 0 #c8fff4;box-shadow:0 5px 0 #0d4d44,inset 0 2px 0 #e0fff8}
.btn.plain{background:linear-gradient(#f7ead0,#d9c39a);box-shadow:0 4px 0 #6b5434}
.btn.small{font-size:18px;padding:8px 18px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- toolbar ---------- */
#toolbar{position:absolute;left:0;right:0;bottom:0;height:105px;z-index:20;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(#8f5d33,#633818 55%,#4a2810);border-top:4px solid #c9903f;box-shadow:inset 0 3px 0 #e8b866,0 -6px 14px rgba(0,0,0,.45)}
#toolbar::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.25;
  background:repeating-linear-gradient(92deg,transparent 0 22px,rgba(0,0,0,.25) 22px 23px,transparent 23px 61px)}
.tb{position:relative;width:76px;height:92px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:#ffe7b0}
.tb .knob{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;border:3px solid #2e1909;
  background:radial-gradient(circle at 35% 30%,#fff1bf,#e2aa48 45%,#8c5a1c);box-shadow:0 4px 0 #2a170a,inset 0 -5px 8px rgba(0,0,0,.28);transition:transform .1s}
.tb:hover .knob{transform:translateY(-2px) rotate(-4deg)}
.tb:active .knob{transform:translateY(2px)}
.tb .knob svg{width:46px;height:46px}
.tb .cap{font-family:var(--display);font-size:13px;letter-spacing:.04em;text-shadow:0 2px 0 #2a170a}
.tb.glow .knob{animation:knobglow 1.2s ease-in-out infinite}
@keyframes knobglow{50%{box-shadow:0 4px 0 #2a170a,0 0 22px 8px #fff09a}}
#inv{position:relative;flex:1;height:82px;border-radius:12px;display:flex;gap:6px;align-items:center;padding:0 8px;overflow-x:auto;overflow-y:hidden;
  background:linear-gradient(#3a1f0c,#55301a);box-shadow:inset 0 4px 10px rgba(0,0,0,.6),0 1px 0 #c9903f;scrollbar-width:thin}
#inv .slot{flex:0 0 68px;height:68px;border-radius:10px;border:2px solid #7a4a26;background:radial-gradient(circle at 50% 35%,#f8e9c4,#d8b97c);display:grid;place-items:center;cursor:pointer;position:relative}
#inv .slot svg{width:56px;height:56px}
#inv .slot.new{animation:pop .6s ease-out 2}
#inv .slot .n{position:absolute;right:3px;bottom:1px;font:15px var(--display);color:#5a2a0a}
#inv .empty{flex:0 0 68px;height:68px;border-radius:10px;border:2px dashed rgba(201,144,63,.35)}
@keyframes pop{40%{transform:scale(1.18)}}

/* ---------- scene ---------- */
#sceneWrap{position:absolute;left:0;top:0;width:1000px;height:520px;overflow:hidden}
#sceneSvg{position:absolute;inset:0;touch-action:none}
.hot{cursor:pointer}
.hot .hz{fill:transparent}
.hot:hover .hz,.hot.pulse .hz{fill:rgba(255,246,190,.13);stroke:rgba(255,246,190,.85);stroke-width:3;stroke-dasharray:8 6}
.hot.pulse .hz{animation:hzp 1s ease-in-out infinite}
@keyframes hzp{50%{stroke:#fff;fill:rgba(255,246,190,.28)}}
.exitArrow{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
.exitArrow.l{animation-name:nudgeL}
@keyframes nudgeL{50%{transform:translateX(-6px)}}
.exitArrow.u{animation-name:nudgeU}
@keyframes nudgeU{50%{transform:translateY(-6px)}}
.exitArrow.d{animation-name:nudgeD}
@keyframes nudgeD{50%{transform:translateY(6px)}}
#tip{position:absolute;z-index:60;pointer-events:none;font:17px var(--display);letter-spacing:.03em;color:#3b1d06;background:#fff3c9;border:2px solid #3b220e;border-radius:10px;padding:3px 10px;box-shadow:0 3px 0 rgba(0,0,0,.35);white-space:nowrap}

/* living things */
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes sway{50%{transform:rotate(2.5deg)}}
.swayb{animation:swayb 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes swayb{50%{transform:rotate(-2deg)}}
.breathe{animation:breathe 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scaleY(1.015)}}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}96.5%{transform:scaleY(1)}}
.lid.l2{animation-delay:1.7s;animation-duration:6.3s}
.twinkle{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.spin{animation:spin 9s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.spinr{animation:spin 7s linear infinite reverse;transform-box:fill-box;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.flick{animation:flick .18s steps(2) infinite alternate}
@keyframes flick{to{transform:scaleY(.82)}}
.drip{animation:drip 3.5s ease-in infinite}

.flutter{animation:flutter 9s ease-in-out infinite}
@keyframes flutter{0%{transform:translate(0,0)}25%{transform:translate(60px,-30px)}50%{transform:translate(120px,10px)}75%{transform:translate(50px,25px)}100%{transform:translate(0,0)}}
.wing{animation:wing .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 50%}

.shimmer{animation:shim 2s ease-in-out infinite}
@keyframes shim{50%{opacity:.55}}
.glowpulse{animation:gp 1.8s ease-in-out infinite}

.talking{animation:talk .5s ease-in-out infinite}

.flow{stroke-dasharray:14 10;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- dialogue ---------- */
#dlgCatch{position:absolute;inset:0;z-index:40}

  background:linear-gradient(#fbf0d2,#efd9a6);border:4px solid #5a3218;border-radius:18px;box-shadow:0 0 0 3px #e7b55c,0 10px 24px rgba(0,0,0,.5)}
#dlg.low{bottom:18px}
#dlg .por{position:absolute;left:-128px;top:-40px;width:172px;height:172px;border-radius:50%;overflow:hidden;border:6px solid #5a3218;box-shadow:0 0 0 4px #e7b55c,0 8px 18px rgba(0,0,0,.5)}
#dlg .por svg{width:100%;height:100%}
#dlg .name{position:absolute;left:84px;top:-22px;font:21px var(--display);letter-spacing:.04em;color:#fff;padding:2px 16px;border-radius:12px;border:3px solid #3b220e;background:#7a4a26;text-shadow:0 2px 0 #3b220e}
#dlg .txt{font-size:24px;line-height:1.36;max-width:64ch}
#dlgChoices{margin-top:10px!important}
#dlgChoices:empty{display:none}
#dlg.big .txt{font-size:30px}
#dlg .ctl{position:absolute;right:12px;bottom:10px;display:flex;gap:8px}
#dlg.narr{left:18px;padding-left:28px;min-height:70px;background:linear-gradient(#2e2350,#1c1534);color:#f6ecd0;border-color:#c9a14a}
#dlg.narr .por{display:none}
#dlg.narr .name{display:none}
.icb{width:46px;height:46px;border-radius:50%;border:3px solid #3b220e;background:radial-gradient(circle at 35% 30%,#fff1bf,#e2aa48 50%,#a06a22);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 #3b220e}
.icb svg{width:26px;height:26px}
.icb.next{animation:nextp 1.2s ease-in-out infinite}
@keyframes nextp{50%{transform:translateX(4px)}}

/* ---------- puzzle frame ---------- */
#pz{position:absolute;inset:0;z-index:30;background:rgba(12,6,22,.72);display:grid;place-items:center}
#pzFrame{position:relative;width:968px;height:600px;border-radius:22px;padding:10px;background:var(--fr,#7a4a26);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.25),inset 0 -6px 0 rgba(0,0,0,.3),0 14px 40px rgba(0,0,0,.6);display:flex;flex-direction:column}
#pzHead{height:86px;display:flex;align-items:center;gap:12px;padding:0 10px;color:#fff}
#pzTitle{font:28px var(--display);letter-spacing:.03em;text-shadow:0 3px 0 rgba(0,0,0,.45);white-space:nowrap}
#pzText{flex:1;font-size:19px;line-height:1.28;background:rgba(255,248,228,.95);color:var(--ink);border-radius:12px;padding:8px 14px;border:2px solid rgba(0,0,0,.35);max-height:78px;overflow:auto}

#pzRound{font:16px var(--display);color:#fff3c0;white-space:nowrap;text-align:center;line-height:1.1}
#pzBody{position:relative;width:948px;height:404px;border-radius:14px;overflow:hidden;background:#000;box-shadow:inset 0 0 0 3px rgba(0,0,0,.4)}
#pzBody > svg.pzSvg{width:948px;height:404px;touch-action:none}
#pzFoot{height:90px;display:flex;align-items:center;gap:12px;padding:0 6px}
#pzGear{width:76px;height:76px;flex:0 0 76px;border-radius:50%;overflow:hidden;background:radial-gradient(#d8fff8,#7fd9cc);border:3px solid #13403a;cursor:pointer}

#pzBubble{flex:1;min-height:52px;font-size:19px;line-height:1.3;color:var(--ink);background:#fffbe9;border:3px solid #13403a;border-radius:16px;padding:6px 14px;position:relative}
#pzBubble::before{content:"";position:absolute;left:-14px;top:18px;border:8px solid transparent;border-right-color:#13403a;border-width:8px 12px 8px 0}
#pzBubble.cheer{background:#eaffd8}
#pzBtns{display:flex;gap:8px;align-items:center}
.cf{position:absolute;pointer-events:none;z-index:5}

/* ---------- panels ---------- */
#panel{position:absolute;inset:0;z-index:50;background:rgba(12,6,22,.66);display:grid;place-items:center}
.sheet{position:relative;width:820px;max-height:560px;overflow:auto;color:var(--ink);padding:26px 34px;border-radius:14px;
  background:radial-gradient(ellipse at 30% 20%,#fff6dc,#f1dcaa 60%,#dfc085);border:4px solid #6b4220;box-shadow:0 0 0 3px #e7b55c,0 18px 40px rgba(0,0,0,.6)}

.sheet p{font-size:20px;line-height:1.4;margin:6px 0}
.sheet .x{position:absolute;right:14px;top:12px}
.tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tabs .btn{font-size:17px;padding:6px 16px}
.tabs .btn.on{background:linear-gradient(#9ff0e2,#3cc4b2);}
.skillRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:19px;padding:6px 0;border-bottom:2px dotted #c9a873}
.jars{display:flex;gap:4px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cur{border:2px solid #b78a4a;border-radius:12px;background:#fff7df;padding:8px;text-align:center;font-size:16px}
.cur svg{width:84px;height:84px;margin:auto}
.cur.miss{opacity:.55}
.letter{font-family:'Andika',serif;font-size:21px;line-height:1.5;background:#fffaf0;border:2px solid #b78a4a;border-radius:6px;padding:14px 18px;color:#3a2050;transform:rotate(-.6deg)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.seg{display:flex;gap:6px}
.seg .btn{font-size:18px;padding:7px 16px}
.seg .btn.on{background:linear-gradient(#9ff0e2,#3cc4b2 55%,#1f8a7c)}

#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;font:20px var(--display);letter-spacing:.03em;color:#3b1d06;
  background:linear-gradient(#fff7d2,#ffd979);border:3px solid #3b220e;border-radius:16px;padding:6px 18px 6px 8px;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:opacity .3s,transform .3s}

#toast[hidden]{display:flex!important;opacity:0;transform:translate(-50%,-20px);pointer-events:none}
#fade{position:absolute;inset:0;z-index:90;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1;pointer-events:auto}

/* ---------- title / intro / grade ---------- */
#titleBtns{position:absolute;left:300px;width:340px;bottom:34px;display:flex;flex-direction:column;align-items:center;gap:12px}
#titleBtns .btn{min-width:280px}
#introNav{position:absolute;right:18px;top:16px;display:flex;gap:10px;z-index:46}
.gcards{position:absolute;left:0;right:0;top:150px;display:flex;justify-content:center;gap:26px}
.gcard{width:270px;height:330px;border-radius:18px;border:4px solid #3b220e;padding:0;cursor:pointer;color:var(--ink);font-family:var(--body);
  background:linear-gradient(#fff6dc,#ecd29b);box-shadow:0 8px 0 #4a2810,0 14px 30px rgba(0,0,0,.5);transition:transform .15s;display:flex;flex-direction:column;align-items:center}
.gcard:hover{transform:translateY(-6px) rotate(-1deg)}
.gcard svg{width:150px;height:150px;margin-top:12px}
.gcard .gt{font:30px var(--display);color:#6b2e0c;letter-spacing:.03em}
.gcard .gs{font:17px var(--display);color:#1f8a7c;letter-spacing:.05em}
.gcard .gd{font-size:16px;line-height:1.3;padding:6px 16px;text-align:center}
.confirm{position:absolute;inset:0;z-index:95;background:rgba(10,5,20,.7);display:grid;place-items:center}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}
.btn.glow{animation:btnglow 1.1s ease-in-out infinite}
@keyframes btnglow{50%{box-shadow:0 5px 0 #0d4d44,0 0 22px 8px #fff09a}}
.shoot{animation:shoot 8s linear infinite}
@keyframes shoot{0%{transform:translate(1000px,40px);opacity:0}2%{opacity:1}10%{transform:translate(640px,170px);opacity:0}100%{transform:translate(640px,170px);opacity:0}}
#sceneName{position:absolute;left:12px;top:10px;z-index:15;font:17px var(--display);letter-spacing:.05em;color:#fff3d0;padding:4px 14px;border-radius:10px;border:3px solid #3b220e;background:linear-gradient(#8f5d33,#5a3218);box-shadow:0 3px 0 rgba(0,0,0,.4);pointer-events:none;text-shadow:0 2px 0 #2a170a}
#endBox{position:absolute;right:24px;top:24px}
#endBox .sheet{width:430px!important;padding:20px 24px}
#endBox .sheet h2{font-size:30px}
#pzBubble{font-size:17px;max-height:84px;overflow:auto;display:flex;flex-direction:column;justify-content:center}
#pzBtns .btn.small{font-size:17px;padding:8px 14px}

/* ================= v2: toolkit, lessons, GearBox, animation ================= */
#pfx{position:absolute;inset:0;pointer-events:none}
#cam{will-change:transform}
#muteBtn{position:absolute;right:12px;top:10px;z-index:16;width:42px;height:42px}
#muteBtn.off svg{opacity:.4}
#muteBtn.off::after{content:"";position:absolute;left:8px;right:8px;top:19px;height:4px;background:#c8432d;transform:rotate(-40deg);border-radius:2px}
/* party */
.pm .pmIn{transition:none}
@keyframes walkbob{50%{transform:translateY(-7px)}}
.pm .pmIn{transform-box:fill-box;transform-origin:50% 100%}
.npcTalk{animation:npcBob .5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes npcBob{50%{transform:translateY(-4px) scaleY(1.02)}}
/* dialogue portraits */
#dlg .por .porS,#dlg .por .porP{position:absolute;inset:0}
#dlg .por .porP{background:radial-gradient(circle at 50% 70%,#e8fffb,#bff6ef)}
#dlg .por .porP svg{width:100%;height:100%}
.listen{display:inline-flex;align-items:center;gap:10px;color:#7a4a26;font-style:italic}
.listen svg{width:30px;height:30px}
/* barks */
.bark{position:absolute;z-index:18;transform:translate(-50%,-100%);max-width:300px;font-size:18px;line-height:1.25;color:#2a1b12;background:#fffbe9;border:3px solid #3b220e;border-radius:16px;padding:7px 12px;box-shadow:0 4px 0 rgba(0,0,0,.3);pointer-events:none;animation:barkIn .35s cubic-bezier(.3,1.6,.5,1)}
.bark::after{content:"";position:absolute;left:50%;bottom:-12px;border:9px solid transparent;border-top-color:#3b220e;transform:translateX(-50%)}
.bark.out{opacity:0;transition:opacity .35s}
@keyframes barkIn{from{transform:translate(-50%,-80%) scale(.6);opacity:0}}
.spot{position:absolute;inset:0;z-index:17;pointer-events:none;animation:spotIn .5s ease-out}
.spot.out{opacity:0;transition:opacity .6s}
@keyframes spotIn{from{opacity:0}}
#fade.iris{transition:none;opacity:1}
.hot.clueHot .hz{fill:rgba(200,160,255,.06)}
/* puzzle footer */
#pzGear{width:110px;height:86px;flex:0 0 110px;border-radius:14px;overflow:visible;background:radial-gradient(ellipse at 50% 60%,#d8fff8,#7fd9cc 70%);border:3px solid #13403a;cursor:pointer;position:relative}
#pzGear svg{position:absolute;left:0;top:-14px;width:110px;height:104px}
#pzFoot{gap:10px}
#pzBubble{font-size:17px}
#pzBtns .btn.small{padding:8px 12px}
.tkBtn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(#ffd0a0,#f29a48 55%,#c86a20)}
.tkBtn .tkIc{width:24px;height:24px;display:inline-block}
.tkBtn.on{background:linear-gradient(#9ff0e2,#3cc4b2 55%,#1f8a7c)}
#pzOffers{display:flex;gap:6px;margin-top:3px}
#pzOffers:not(:has(.btn:not([hidden]))){display:none}
#pzOffers .btn{font-size:14px!important;padding:3px 10px!important;box-shadow:0 3px 0 #3b220e}
#pzOffers .btn:not([hidden]){animation:offerIn .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes offerIn{from{transform:scale(.5);opacity:0}}
.pzSvg{position:absolute;inset:0}
/* toolkit drawer */
#tk{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;background:#3a2414;animation:tkIn .3s ease-out}
@keyframes tkIn{from{transform:translateY(30px);opacity:0}}
#tkTabs{height:46px;flex:0 0 46px;display:flex;align-items:stretch;gap:3px;padding:3px 4px 0;background:linear-gradient(#7a4a26,#5a3218)}
.tkTab{flex:1;min-width:0;border:2px solid #3b220e;border-bottom:0;border-radius:10px 10px 0 0;background:linear-gradient(#e8c890,#c8a060);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0 2px;font:11px var(--display);letter-spacing:.02em;color:#3b1d06;position:relative}
.tkTab svg{width:22px;height:22px}
.tkTab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tkTab.on{background:linear-gradient(#fff6dc,#f0dcb0);transform:translateY(2px)}
.tkTab.sug::after{content:"★";position:absolute;right:3px;top:0;font-size:12px;color:#c8432d}
.tkBack{flex:0 0 auto;margin:2px 0 4px 4px;font-size:14px!important;padding:4px 10px!important}
#tkArea{position:relative;flex:1}
.tkTool{position:absolute;inset:0}
.toolsvg{position:absolute;left:0;top:0;width:948px;height:358px;touch-action:none}
.scratchWrap{position:absolute;left:0;top:0;width:948px;height:290px}
.scratchCv{width:948px;height:290px;touch-action:none;cursor:crosshair;display:block}
.scratchBar{pointer-events:none}
.scratchBar [data-k]{pointer-events:auto}
.toolNote{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;font:28px var(--display);letter-spacing:.03em;color:#3b1d06;background:#fff3a0;border:3px solid #3b220e;border-radius:16px;padding:4px 18px;box-shadow:0 4px 0 rgba(0,0,0,.3);pointer-events:none}
.toolNote.pop{animation:barkIn .4s cubic-bezier(.3,1.6,.5,1)}
/* lesson */
#pzFrame.lesson{box-shadow:inset 0 0 0 3px rgba(255,255,255,.25),inset 0 -6px 0 rgba(0,0,0,.3),0 0 0 6px #ffd860,0 14px 40px rgba(0,0,0,.6)}
.lessonTK #tkTabs{align-items:center;justify-content:center;gap:6px;padding:0 10px}
.lstep{display:flex;align-items:center;gap:6px;font:15px var(--display);letter-spacing:.03em;color:#e8c890;padding:4px 12px;border-radius:14px}
.lstep span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#3b220e;color:#e8c890;font-size:13px}
.lstep.on{background:#fff3a0;color:#3b1d06}
.lstep.on span{background:#c8432d;color:#fff}
.lstep.done{color:#9ff0e2}
.lstep.done span{background:#2fa59a;color:#fff}
.lsep{width:22px;height:3px;background:#a07040;border-radius:2px}
/* journal */
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lcard{display:flex;gap:10px;align-items:flex-start;border:2px solid #b78a4a;border-radius:12px;background:#fff7df;padding:8px}
.lcard.miss{opacity:.6}
.lic{width:52px;height:52px;flex:0 0 52px;border-radius:10px;background:#f0dcb0;border:2px solid #b78a4a;display:grid;place-items:center}
.lic svg{width:44px;height:44px}
.lbody{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:16px}
.lbody b{font:19px var(--display);color:#6b2e0c;letter-spacing:.02em}
.lbody .btn.small{font-size:14px;padding:4px 10px}
.lstat{font-size:13px;padding:2px 8px;border-radius:8px;background:#e8d8b0}
.lstat.learned{background:#bff0c8}
.myst{border:2px solid #b78a4a;border-radius:12px;background:#fff7df;padding:8px 14px;margin:8px 0;display:flex;flex-direction:column}
.myst b{font:20px var(--display);color:#6b2e0c;letter-spacing:.02em}
.myst.solved{background:#eaffe8;border-color:#5a9a5a}
.myst.miss{opacity:.55}
.myst ul{margin:4px 0 0 18px;padding:0;font-size:17px}
.myst li{color:#9a8a6a;font-style:italic}
.myst li.got{color:#2a1b12;font-style:normal}
/* intro & title */
#introSvg{animation:kenburns 18s ease-in-out both}
@keyframes kenburns{from{transform:scale(1.06) translate(-10px,-6px)}to{transform:scale(1) translate(0,0)}}
#titleGear{overflow:visible}
.danceA{animation:dance .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.danceB{animation:dance .6s .3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dance{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(4deg) translateY(-10px)}}
/* reduced motion */
#stage.rm *,#stage.rm *::before,#stage.rm *::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}

#pzBubble.long{font-size:15px;line-height:1.22}
/* ================= v3: layered scenes, GearBox, painterly props ================= */
.flowV{stroke-dasharray:6 18;animation:flowV .7s linear infinite}
@keyframes flowV{to{stroke-dashoffset:-24}}
.raysBreath{animation:rays 7s ease-in-out infinite}
@keyframes rays{50%{opacity:.55}}
.flame{animation:flame .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flame{0%{transform:scale(1,1) skewX(0deg)}50%{transform:scale(.94,1.1) skewX(3deg)}100%{transform:scale(1.05,.92) skewX(-3deg)}}
#props,#camNear{will-change:transform}
.camL{will-change:transform}
#stage.rm .flowV,#stage.rm .raysBreath,#stage.rm .flame{animation:none}
.wingC{animation:wingC .3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes wingC{to{transform:scaleX(.35)}}
/* ---------- GearBox toolkit: drawers that unfold out of GearBox ---------- */
#tk{background:radial-gradient(ellipse at 50% 0%,#5a3420,#2e1a10 70%);box-shadow:inset 0 0 0 4px #8a2818,inset 0 0 0 7px #e7b24c,inset 0 0 0 9px #2a1b12}
#tk.unfold{animation:tkUnfold .55s cubic-bezier(.2,.9,.3,1.15) both;transform-origin:0% 100%}
@keyframes tkUnfold{0%{clip-path:inset(92% 88% 0 0 round 18px);transform:scale(.6)}55%{clip-path:inset(0 0 0 0 round 18px)}100%{clip-path:inset(0 0 0 0 round 14px);transform:scale(1)}}
#tkTabs{height:50px;flex:0 0 50px;gap:4px;padding:6px 10px 0;background:linear-gradient(#a7331f,#7a2213);box-shadow:inset 0 -3px 0 #4a140a,inset 0 2px 0 #ef7656}
.tkTab{position:relative;border:2px solid #2a1b12;border-bottom:0;border-radius:8px 8px 0 0;background:linear-gradient(#fff6dc,#e2cf9f);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
#tk.unfold .tkTab{animation:drawerIn .38s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(.18s + var(--i,0) * .04s)}
@keyframes drawerIn{from{transform:translateY(40px);opacity:0}}
.tkTab .pull{position:absolute;left:50%;top:3px;width:18px;height:4px;margin-left:-9px;border-radius:3px;background:linear-gradient(#fff0a8,#b47a26);box-shadow:0 1px 0 #2a1b12}
.tkTab svg{margin-top:5px}
.tkTab.on{background:linear-gradient(#fffdf2,#f6e6bd);transform:translateY(-3px);box-shadow:0 0 0 2px #ffd860,inset 0 -4px 0 rgba(0,0,0,.08)}
.tkTab.journal{background:linear-gradient(#cfe8d0,#9cc8a0)}
/* the free workshop overlay */
#kit{position:absolute;inset:0;z-index:35;background:rgba(12,6,22,.72);display:grid;place-items:center;animation:spotIn .25s}
#kit.out{animation:kitOut .26s ease-in forwards}
@keyframes kitOut{to{opacity:0}}
#kitFrame{position:relative;width:968px;height:600px;border-radius:22px;padding:10px;background:linear-gradient(#d4503a,#8a2818);box-shadow:inset 0 0 0 3px rgba(255,255,255,.2),inset 0 -6px 0 rgba(0,0,0,.3),0 0 0 5px #e7b24c,0 0 0 8px #2a1b12,0 14px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px}
#kitHead{height:70px;display:flex;align-items:center;gap:14px;padding:0 10px;background:linear-gradient(#fff6dc,#e9d6a6);border-radius:14px;border:3px solid #2a1b12}
.kitTitle{font:26px var(--display);color:#8a2818;letter-spacing:.02em}
.kitSub{flex:1;font-size:17px;color:#5a3a22}
#kitBody{position:relative;height:404px;border-radius:14px;overflow:hidden;background:#000}
#kitFoot{flex:1;display:flex;align-items:center;gap:12px;padding:0 6px}
#kitGear{width:110px;height:96px;flex:0 0 110px;position:relative;cursor:pointer;border-radius:14px;background:radial-gradient(ellipse at 50% 60%,#d8fff8,#7fd9cc 70%);border:3px solid #13403a}
#kitGear svg{position:absolute;left:0;top:-14px;width:110px;height:104px}
#kitBubble{flex:1;min-height:60px;background:#fffdf4;border:3px solid #2a1b12;border-radius:16px;padding:8px 14px;font-size:19px;display:flex;align-items:center;position:relative}
#kitBubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid #2a1b12;border-left:0}
#kitMsg{color:#2a1b12;line-height:1.3}
/* profiles */
.profChip{display:inline-flex!important;align-items:center;gap:8px}
.pdot{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font:17px var(--display);border:2px solid #2a1b12;flex:0 0 30px}
.profs{display:flex;flex-direction:column;gap:8px;min-width:640px}
.prof{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:#fff6dc;border:2px solid #c9a46a}
.prof.on{border-color:#2fa59a;box-shadow:0 0 0 3px #bff6ef}
.prof .pname{flex:1;display:flex;flex-direction:column}
.prof .pname small{color:#7a4a26;font-size:15px}
.ptag{font:15px var(--display);color:#1f7f75;padding:0 8px}
.pinput{flex:1;font:20px var(--body,inherit);padding:8px 12px;border-radius:10px;border:2px solid #c9a46a;background:#fffdf4}
/* ask to rotate on portrait touch screens */
#rotate{display:none}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:grid;position:fixed;inset:0;z-index:99;place-items:center;background:#1a1030;color:#fff3d0;font:28px 'Luckiest Guy',sans-serif;text-align:center;padding:30px}}

      s += `<path d="M${x-ex} ${y+2}Q${x} ${y-ey} ${x+ex} ${y+2}" stroke="${OL}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    } else {
      s += `<ellipse cx="${x}" cy="${y}" rx="${ex}" ry="${ey}" fill="#fff" stroke="${OL}" stroke-width="2"/>`;
      s += `<circle cx="${x+px}" cy="${y+1+py}" r="${big?3:3.6}" fill="${o.pupil||'#2a1b12'}"/><circle cx="${x+px+1.4}" cy="${y-.6+py}" r="1.3" fill="#fff"/>`;
      s += `<ellipse class="lid${i?' l2':''}" cx="${x}" cy="${y}" rx="${ex+.8}" ry="${ey+.8}" fill="${skin}" stroke="${OL}" stroke-width="1.5"/>`;
    }
  });
  // brows
  const bc = o.brow || OL, by = y - ey - 4;
  const raise = big ? -4 : 0;
  const lb = mood==='sad' ? `M${lx-6} ${by}Q${lx} ${by-2} ${lx+6} ${by-4}` : `M${lx-6} ${by+raise}Q${lx} ${by-4+raise} ${lx+6} ${by+raise}`;

  s += `<path d="${lb}" stroke="${bc}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="${rb}" stroke="${bc}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  return s;
}
function mouthSVG(x, y, mood, w = 10){

const SHARD_COLS = [['#fff3a0','#ffb02e','#b06a10'],['#ffd0a0','#ff7a3a','#a03a10'],['#ffd0f0','#d65fff','#6a1fa0'],['#d0fbff','#3fc8ff','#1c4fa0']];
function shardSVG(i, x, y, s){
  const c = SHARD_COLS[i];
  const rot = [0, 90, 180, 270][i];
  return `<g transform="translate(${x} ${y}) scale(${s/64})"><g transform="rotate(${rot} 32 32)"><path d="M32 32V4a28 28 0 0 1 28 28z" fill="${c[1]}" stroke="${OL}" stroke-width="3" stroke-linejoin="round"/><path d="M32 32V12a20 20 0 0 1 20 20z" fill="${c[0]}" opacity=".7"/><path d="M36 28l6-14l2 12z" fill="#fff" opacity=".8"/><path d="M32 4a28 28 0 0 1 28 28" stroke="${c[2]}" stroke-width="3" fill="none"/></g></g>`;
}
function compassSVG(cx, cy, r, pieces, fixed){
  let o = '';
  if (fixed){
    o += `<circle cx="${cx}" cy="${cy}" r="${r*2}" fill="url(#gGlowY)" class="glowpulse"/>`;
    for (let i = 0; i < 8; i++) o += `<path d="M${cx} ${cy}L${f1(cx+Math.cos(i*Math.PI/4)*r*3.2)} ${f1(cy+Math.sin(i*Math.PI/4)*r*3.2)}" stroke="#fff6c0" stroke-width="${i%2?3:7}" opacity=".5" class="shimmer"/>`;
  }
  o += `<circle cx="${cx}" cy="${cy}" r="${r+16}" fill="none" stroke="url(#gBrass)" stroke-width="14"/><circle cx="${cx}" cy="${cy}" r="${r+16}" fill="none" stroke="${OL}" stroke-width="2"/>`;
  o += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#1a1436" stroke="${OL}" stroke-width="3"/>`;
  for (let i = 0; i < 4; i++){
    if (i < pieces) o += shardSVG(i, cx - r, cy - r, r*2);
    else { const a = [0,90,180,270][i]; o += `<g transform="rotate(${a} ${cx} ${cy})"><path d="M${cx} ${cy}V${cy-r}a${r} ${r} 0 0 1 ${r} ${r}z" fill="none" stroke="#5a5080" stroke-width="3" stroke-dasharray="8 6"/></g>`; }
  }
  o += `<circle cx="${cx}" cy="${cy}" r="${r*.16}" fill="url(#gBrassR)" stroke="${OL}" stroke-width="3"/><polygon points="${starPts(cx,cy,r*.12,r*.05,4)}" fill="#fff"/>`;
  return o;
}
function symbolSVG(s, x, y, r, c){
  if (s === 'moon') return `<path d="M${f1(x+r*.5)} ${f1(y-r*.866)}A${r} ${r} 0 1 0 ${f1(x+r*.5)} ${f1(y+r*.866)}A${f1(r*.9)} ${f1(r*.9)} 0 0 1 ${f1(x+r*.5)} ${f1(y-r*.866)}z" fill="${c}"/>`;
  if (s === 'sun') return `<g><circle cx="${x}" cy="${y}" r="${r*.5}" fill="${c}"/>${Array.from({length:8},(_,i)=>{const a=i*Math.PI/4;return `<path d="M${f1(x+Math.cos(a)*r*.68)} ${f1(y+Math.sin(a)*r*.68)}L${f1(x+Math.cos(a)*r)} ${f1(y+Math.sin(a)*r)}" stroke="${c}" stroke-width="${f1(r*.2)}" stroke-linecap="round"/>`}).join('')}</g>`;
  if (s === 'star') return `<polygon points="${starPts(x,y,r,r*.45)}" fill="${c}"/>`;
  if (s === 'leaf') return `<path d="M${x-r} ${y+r}Q${x-r} ${y-r} ${x+r} ${y-r}Q${x+r} ${y+r} ${x-r} ${y+r}z" fill="${c}"/>`;
  return '';
}

function h(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);

    if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);

}

const Snd = {
  ctx: null, master: null, sfx: null, mus: null, timer: null, song: null, step: 0, next: 0,
  init(){
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      this.sfx = this.ctx.createGain(); this.sfx.gain.value = .55; this.sfx.connect(this.master);
      this.mus = this.ctx.createGain(); this.mus.connect(this.master);
      this.apply();
    } catch (e){ this.ctx = null; }
  },
  apply(){ if (!this.ctx) return; this.master.gain.value = S.settings.muted ? 0 : 1; this.mus.gain.value = S.settings.music ? .1 : 0; if (this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, d, type = 'sine', v = .3, t0 = 0, dest, slideTo){
    if (!this.ctx) return;
    const t = this.ctx.currentTime + t0, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + d);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0008, t + d);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + d + .05);
  },
  play(n){
    if (!this.ctx || S.settings.muted) return;
    const T = (...a) => this.tone(...a);
    switch (n){
      case 'click': T(660, .07, 'triangle', .2); break;
      case 'pick': T(520, .08, 'square', .08); T(780, .1, 'triangle', .18, .05); break;
      case 'drop': T(300, .12, 'triangle', .25, 0, null, 200); break;
      case 'clunk': T(140, .18, 'square', .1, 0, null, 90); T(220, .1, 'triangle', .15); break;
      case 'good': [523, 659, 784].forEach((f, i) => T(f, .25, 'triangle', .22, i * .08)); break;
      case 'win': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => T(f, .32, 'triangle', .22, i * .11)); [262, 392].forEach((f, i) => T(f, .9, 'sine', .15, i * .22)); break;
      case 'oops': T(330, .16, 'sine', .2); T(262, .25, 'sine', .2, .12); break;
      case 'item': [784, 988, 1175, 1568].forEach((f, i) => T(f, .2, 'sine', .18, i * .07)); break;
      case 'whoosh': T(900, .4, 'sawtooth', .04, 0, null, 120); break;
      case 'beep': T(1200, .05, 'square', .06); T(1600, .05, 'square', .06, .07); break;
      case 'blip': T(880 + Math.random() * 300, .04, 'square', .025); break;
      case 'tick': T(1800, .03, 'square', .05); break;
      case 'croak': T(160, .12, 'sawtooth', .12, 0, null, 120); T(150, .15, 'sawtooth', .12, .16, null, 110); break;
      case 'chime': [1047, 1319, 1568, 2093].forEach((f, i) => T(f, .6, 'sine', .12, i * .15)); break;
      case 'stone': T(90, .35, 'triangle', .3, 0, null, 60); break;
    }
  },
  SONGS: {
    title: { bpm: 84, scale: [0, 2, 4, 7, 9], root: 57, seed: 3 },
    rain: { bpm: 96, scale: [0, 2, 4, 7, 9], root: 55, seed: 7 },
    desert: { bpm: 104, scale: [0, 1, 4, 5, 7, 8, 10], root: 57, seed: 11 },
    caves: { bpm: 76, scale: [0, 3, 5, 7, 10], root: 52, seed: 19 },
    stars: { bpm: 70, scale: [0, 2, 4, 6, 7, 11], root: 60, seed: 23 }
  },
  music(name){
    if (!this.ctx) return;
    if (this.songName === name) return;
    this.songName = name; clearInterval(this.timer);
    const sp = this.SONGS[name]; if (!sp) return;
    const R = rng(sp.seed), len = 32, mel = [], bass = [];
    let deg = 2;
    for (let i = 0; i < len; i++){ deg = clamp(deg + Math.round((R() - .5) * 4), 0, sp.scale.length * 2 - 1); mel.push(R() < .72 ? deg : -1); }

    this.timer = setInterval(() => {
      if (!this.ctx) return;
      while (this.next < this.ctx.currentTime + .25){
        const s = this.step % len, d = this.song.mel[s];
        const sc = sp.scale, note = d < 0 ? null : sp.root + 12 + sc[d % sc.length] + 12 * Math.floor(d / sc.length);
        const t0 = this.next - this.ctx.currentTime;
        if (note) this.tone(hz(note), dur * 1.8, 'triangle', .22, t0, this.mus);
        if (s % 8 === 0){ const b = this.song.bass[(s / 8) | 0]; this.tone(hz(sp.root - 12 + sc[b % sc.length]), dur * 7, 'sine', .35, t0, this.mus); }
        if (s % 4 === 2) this.tone(hz(sp.root + sc[(this.song.bass[(s / 8) | 0] + 2) % sc.length]), dur * 1.5, 'sine', .12, t0, this.mus);
        this.next += dur; this.step++;
      }
    }, 90);
  }
};

let PARTY = null;

function partyCenter(id){ const i = PARTY_IDS.indexOf(id), s = PARTY.s || .82; return [partyMemberX(i) + 60 * s, PARTY.y - 150 * s]; }
const POSE_ACT = (id, p) => p === 1 ? (id === 'nora' ? 'examine' : 'wave') : p === 2 ? 'point' : p === 3 ? 'cheer' : null;
const MOOD_ACT = { surprised: 'surprised', confused: 'confused', think: 'think', sad: 'worried', worried: 'worried', nervous: 'worried', laugh: 'laugh', excited: 'cheer' };
function partyActor(id){ return PARTY && PARTY.actors ? PARTY.actors[id] : null; }
function drawParty(){
  const g = $('#party'); if (!g || !PARTY) return;
  const s = PARTY.s || .82, w = 120 * s, hh = 230 * s;
  if (!g.dataset.built){
    g.innerHTML = PARTY_IDS.map((id, i) => `<g class="hot pm pm-${id}" data-hot="party-${id}" data-tip="${CHARS[id].name}"><g class="pmIn"><svg class="pmSvg" width="${f1(w)}" height="${f1(hh)}" viewBox="0 0 120 230" overflow="visible"></svg></g></g>`).join('');
    g.dataset.built = 1;
    PARTY.gearActor = new GearActor(g.querySelector('.pm-gearbox svg'), { mood: 'happy' });
    PARTY.actors = { gearbox: PARTY.gearActor, mateo: new CharActor(g.querySelector('.pm-mateo svg'), 'mateo'), nora: new CharActor(g.querySelector('.pm-nora svg'), 'nora') };
  }
  PARTY_IDS.forEach((id, i) => {
    const m = g.querySelector('.pm-' + id), sv = m.querySelector('svg');
    sv.setAttribute('x', f1(partyMemberX(i))); sv.setAttribute('y', f1(PARTY.y - hh));
    if (id === 'gearbox') return;
    const A = PARTY.actors[id];
    const mood = PARTY.moods[id] && PARTY.moods[id] !== 'talk' ? PARTY.moods[id] : 'happy';
    const pose = PARTY.pose[id] || 0;
    if (PARTY.talk && PARTY.talk !== id){
      const j = PARTY_IDS.indexOf(PARTY.talk);
      if (j >= 0) A.lookAt(j > i ? 1 : -1, 0);
      else { const e = document.getElementById('npc-' + PARTY.talk); if (e){ const bb = e.getBBox ? e.getBBox() : null; if (bb) A.lookAt(Math.sign(bb.x + bb.width / 2 - partyCenter(id)[0]), -.2); } }
    } else if (PARTY.lookAt) A.lookAt(Math.sign(PARTY.lookAt[0] - partyCenter(id)[0]), clamp((PARTY.lookAt[1] - partyCenter(id)[1]) / 200, -1, 1));

function partyMood(who, mood){

  if (who !== 'gearbox' && PARTY.gearActor && (mood === 'surprised' || mood === 'excited') && Math.random() < .5) setTimeout(() => PARTY.gearActor && PARTY.gearActor.react(mood === 'surprised' ? 'discover' : 'laugh'), 350);

let CUR = null;
/* ---------- layered scene art (baked WebP layers with vector fallback) ---------- */
const ASSET_BASE = 'assets/';
const LAYER_STATE = {};   // id -> 'ok' | 'fail' | Promise
function loadLayer(id){
  if (LAYER_STATE[id] === 'ok' || LAYER_STATE[id] === 'fail') return Promise.resolve(LAYER_STATE[id]);
  if (LAYER_STATE[id]) return LAYER_STATE[id];
  return LAYER_STATE[id] = new Promise(res => {
    if (window.NO_ASSETS && !(typeof ASSET_INLINE !== 'undefined' && ASSET_INLINE[id])){ LAYER_STATE[id] = 'fail'; return res('fail'); }
    const im = new Image(); let done = false;
    const fin = v => { if (done) return; done = true; LAYER_STATE[id] = v; res(v); };
    im.onload = () => (im.decode ? im.decode().catch(() => {}) : Promise.resolve()).then(() => fin('ok'));
    im.onerror = () => fin('fail');
    setTimeout(() => fin('fail'), 4000);
    im.src = assetURL(id);
  });
}
function assetURL(id){ return (typeof ASSET_INLINE !== 'undefined' && ASSET_INLINE[id]) || ASSET_BASE + id + '.webp'; }
function sceneLayerIds(sc){ return sc && sc.layers ? Object.values(sc.layers).map(l => l.id) : []; }
function preloadScene(id){ return Promise.all(sceneLayerIds(SCENES[id]).map(loadLayer)); }

/* ---------- 9. MINE CART TRACK (number sequences / paths) ---------- */
PZ.cart = {
  title: 'The Mine Cart Track', world: 'caves', skill: 'pattern', rounds: 2,
  gen(g, l, o){
    const COLS = 6, ROWS = 4;
    for (let tries = 0; tries < 200; tries++){
      // monotone path left -> right with vertical detours

      for (let c = 0; c < COLS; c++){
        if (c > 0) path.push([c, r]);
        if (c < COLS - 1 && Math.random() < .55){ const nr = rnd(0, ROWS - 1); while (r !== nr){ r += Math.sign(nr - r); path.push([c, r]); } }
      }
      const rules = g === 1 ? (o.easy ? [['+', 1]] : [[['+', 1]], [['+', 2], ['-', 1]], [['+', 10], ['-', 2], ['+', 5]]][l])
        : g === 2 ? (o.easy ? [['+', 2]] : [[['+', 5], ['+', 10]], [['-', 10], ['+', 3], ['+', 4]], [['+', 100], ['-', 5], ['+', 25]]][l])
        : (o.easy ? [['+', 3]] : [[['+', 6], ['+', 7], ['+', 8]], [['-', 7], ['+', 9], ['-', 6]], [['x', 2], ['+', 12], ['-', 9]]][l]);
      const [op, n] = pick(rules), N = path.length;

    }

/* ---------- script runner for demonstrations ---------- */
async function runScript(inst, steps, say, token){

    const [op, ...a] = s;

function changeSteps(price, paid){
  const out = []; let v = price;
  const add = c => { out.push(['do', 'add', 1, c, 1]); v += c; };
  while (v % 5) add(1);
  while (v % 10) add(5);
  while (v < paid && (v % 25)) add(v + 10 <= paid ? 10 : 5);
  while (v + 25 <= paid) add(25);
  while (v < paid) add(v + 10 <= paid ? 10 : v + 5 <= paid ? 5 : 1);
  return out;
}

}

  if (ev.fade) kf.push({ transform: `translate(${ev.path[1][0]}px,${ev.path[1][1]}px)`, opacity: 0 });
  g.animate(kf, { duration: ev.ms, easing: 'linear' }).onfinish = () => g.remove();
  if (ev.sfx) Snd.play(ev.sfx);
}

function clueWorld(id){ return Object.keys(MYSTERIES).find(w => MYSTERIES[w].clues[id]); }
function findClue(id, lines, cb){
  const w = clueWorld(id); if (!w || S.clues[id]){ lines ? say(lines, cb) : cb && cb(); return; }
  S.clues[id] = true; save();
  const M = MYSTERIES[w], found = Object.keys(M.clues).filter(k => S.clues[k]).length, total = Object.keys(M.clues).length;
  if (PARTY && PARTY.gearActor) PARTY.gearActor.react('discover');
  Snd.play('chime');
  const after = () => {
    toast(`Clue ${found} of ${total}: ${M.title}`, 'letter');
    if (found === total && !S.mysteries[w]){ S.mysteries[w] = true; save(); say([['gearbox', gearLine('discover') + ` We found every clue for <b>${M.title}</b>! Detective meeting!`, 'excited']].concat(M.theory, [['narrator', `Little mystery solved: ${M.answer} It's written in Explorer's Journal.`]]), cb); }
    else say([['gearbox', `${pick(['Clue!', 'Another clue!', 'Ooh, evidence!'])} I wrote it in my notebook under <b>${M.title}</b>. ${total - found} more to find.`, 'excited']], cb);
  };
  lines ? say(lines, after) : after();
}

function npcMenu(npc, intro, main, topics){
  const ch = []; if (main) ch.push(main);
  topics.filter(t => !t.show || t.show()).forEach(t => ch.push([t.label, () => {
    S.talked[npc + ':' + t.label] = true; save();
    const go = () => { t.after && t.after(); npcMenu(npc, null, main, topics); };
    t.clue ? findClue(t.clue, t.lines(), go) : say(t.lines(), go);
  }]));
  ch.push(['Goodbye', () => say([[npc, pick(BYES[npc]), 'happy']])]);
  say([{ who: npc, mood: 'happy', text: intro || pick(['Anything else, explorers?', 'What else would you like to know?', 'Ask away!']), choices: ch }]);
}

}
