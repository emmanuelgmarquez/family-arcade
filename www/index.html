<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Family Arcade</title>
  <meta name="description" content="Our family's offline game library.">
  <meta name="theme-color" content="#07080f">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Family Arcade">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="preload" href="fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/arcade.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="floor"></div>
    <div class="scanlines"></div>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" class="brand-icon" width="40" height="40">
        <span class="brand-name">FAMILY<span> ARCADE</span></span>
      </div>
      <div class="topbar-right">
        <span class="status-pill" id="offline-pill" hidden><span class="dot"></span><span>Offline ready</span></span>
        <span class="clock" id="clock"></span>
        <button class="icon-btn" id="btn-import" type="button" aria-label="Add a game"></button>
        <button class="icon-btn" id="btn-sound" type="button" aria-label="Sound effects"></button>
        <button class="icon-btn" id="btn-settings" type="button" aria-label="Settings"></button>
      </div>
    </header>

    <main class="home">
      <section class="hero" id="hero" aria-live="polite"></section>
      <section class="shelf" aria-label="Games">
        <div class="carousel" id="carousel" role="listbox" aria-label="Game library"></div>
      </section>
    </main>

    <footer class="hints" id="hints"></footer>
  </div>

  <div id="player" class="player" hidden></div>

  <div id="splash" class="splash">
    <div class="splash-inner">
      <img src="icons/icon-192.png" alt="" width="96" height="96" class="splash-icon">
      <div class="splash-title">FAMILY ARCADE</div>
      <div class="splash-bar"><span></span></div>
      <div class="splash-msg" id="splash-msg">Loading…</div>
    </div>
  </div>

  <input type="file" id="file-input" accept=".zip,.html,.htm,application/zip,application/x-zip-compressed,text/html" multiple hidden>
  <input type="file" id="backup-input" accept=".json,application/json" hidden>

  <noscript><p style="color:#fff;padding:2rem;font-family:system-ui">Family Arcade needs JavaScript turned on.</p></noscript>
</body>
</html>
